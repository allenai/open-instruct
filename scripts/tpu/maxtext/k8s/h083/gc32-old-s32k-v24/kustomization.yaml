# fp32 identity test (ledger-manager ruling 2026-10-23), sequence 32768: gradcmp-old with fp32 activations,
# matmul_precision=highest (config and JAX default) and megablox=false (jax.lax.ragged_dot). Generated by mk_gc32.py.
# H083 sci-s0 1-step gradient comparison (ledger-manager ruling 2026-10-23), image 51f8cc4b-p907d86f3-rfb46e215e. The pair gradcmp-old /
# gradcmp-bs is identical except the image tag. R1's overlay (h083-sci-s0-ep8ref) with STEPS=1, plain SGD (OPT_TYPE=sgd), no
# clipping (CLIP_THRESHOLD=0), LR 1e8 and a checkpoint after step 1: p1 = p0 - lr1*g in fp32 with lr1*|g| >> |p0|, so
# |g_bs - g_old| / |g_old| = |p1_bs - p1_old| / |p0 - p1_old| (compare.py on Hammond). The step-1 gradient does not depend
# on the optimizer, only its read-out does, and that is the same for both images.
# H083 sci arm, seed 0: H067 A0''s overlay with RUN_NAME, the shards (h083/sci3-s0), the restore-fix image
# and MAXTEXT_LOG_BATCH_HASH=1 changed (generated by the ledger's experiments/h083/mk_h083.py).
# Olmo 3.5 hero-small SFT on TPU, the H045 anchor recipe (olmo35-small-4t-emo base, Dolci-Think, the Olmo 3.5
# template with H045's prefix labelling, 65,536-token sequences, 1,048,576 tokens/step, LR 5e-5, 3% warmup (from step one, as OLMo-core) then
# linear to 0 over 11,768 steps, AdamW wd 0, clip 1.0, router load-balancing 0.01 and router z-loss 1e-5 summed over MoE layers as OLMo-core does, LM-head z-loss 1e-5, EMO off). MoE buffers hold 2.5x the mean load per expert shard (dropless needs 32.9 of 31.75 GiB at 64K; the REQUIRED_RBF
# log line gives, per step and MoE layer, the factor that would have dropped nothing: at most 2.41 over the 600 parity steps).
# STEPS < LR_SCHEDULE_STEPS runs the start of that schedule for loss parity against H045's W&B curve.
#   kubectl --context gke_ai2-olmo_us-central2-b_gke-tpu-v4 apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: olmo

resources:
- jobset.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: h083-gc32-old-s32k-v24-launcher
  files:
  - train_sft.sh # a copy of ../olmo3-sft/train_sft.sh (kustomize loads no files from outside this directory); keep them identical
- name: h083-gc32-old-s32k-v24-env
  literals:
  - RUN_NAME=h083-gc32-old-s32k-v24
  - OUTPUT_DIR=gs://ai2-olmo-dev/post-training/scratch
  # OLMo-core step5961 converted with o35/convert_olmocore_to_maxtext.py (fp32 masters, padded 100352 vocab).
  - LOAD_PARAMETERS_PATH=gs://ai2-olmo-dev/post-training/checkpoints/olmo35-small-4t-emo-step5961/0/items
  # allenai/dolma2-tokenizer-olmo35 @8b971706 with open-instruct's olmo35 template, saved by o35/tok_oi35.py.
  - MAXTEXT_LOG_BATCH_HASH=1
  - TOKENIZER_PATH=/mnt/post-training/tokenizers/olmo35-8b971706-h045
  - TRAIN_FILES=/mnt/post-training/data/h083/sci3-s0/*.parquet
  - MODEL_NAME=olmo35-tiny
  - MAXTEXT_SFT_LABELS=prefix
  - TOTAL_DEVICES=128
  - GLOBAL_BATCH=16
  - PER_DEVICE_BATCH=0.125
  - SEQ_LEN=32768
  - LR=1e8
  - OPT_TYPE=sgd
  - CLIP_THRESHOLD=0
  - DTYPE=float32
  - JAX_DEFAULT_MATMUL_PRECISION=highest
  - WARMUP_FRAC=0.03
  - LR_SCHEDULE_STEPS=11768
  - STEPS=1
  - NUM_EPOCH=2
  - DATA_SEED=0
  # FSDP 16 x expert 8 = 128 chips, no tensor or context axes (olmo35-ep-as-cp): batch shards over fsdp (16 sequences),
  # and the expert axis is context parallelism outside the dMoE (one 64K sequence over 8 chips) and expert parallelism
  # inside it. KDA's recurrence needs the whole sequence, so its 8 heads shard over the expert axis instead.
  # Sub-block KDA at highest matmul precision: 3.9 s/step against 39 s for FSDP4 x EP4 x TP4 x CP2 (d_model 1024 is too
  # narrow for tensor parallelism), loss parity with H045 passes (#1933). At default precision either KDA path is ~3e-3
  # off the exact recurrence on TPU; highest brings both to ~3e-6 for ~5% of the step.
  - EXTRA_ARGS=override_model_config=true moe_aux_loss_reduction=sum warmup_step_offset=1 z_loss_multiplier=1e-5 emo_enabled=false enable_checkpointing=true checkpoint_period=1 max_num_checkpoints_to_keep=1 custom_mesh_and_rule=olmo35-ep-as-cp ici_fsdp_parallelism=16 ici_expert_parallelism=8 context_parallel_load_balance=false allow_split_physical_axes=true shard_exp_on_fsdp=False ragged_buffer_factor=2.5 log_required_ragged_buffer_factor=true sharding_tolerance=0.3 olmoe3_per_layer_remat=true sparse_matmul=true megablox=true use_tokamax_kda=false kda_chunked_impl=subblock kda_matmul_precision=highest num_vocab_tiling=16 remat_policy=full matmul_precision=highest megablox=false
  - LIBTPU_INIT_ARGS=--xla_enable_async_all_gather=true --xla_tpu_enable_async_ragged_all_to_all=true --xla_tpu_scoped_vmem_limit_kib=24576
  # An environment variable, not a libtpu flag: v4 megacore frees ~1 GiB of HBM.
  - TPU_MEGACORE=MEGACORE_DENSE

images:
- name: us-docker.pkg.dev/ai2-olmo/olmo/maxtext-posttrain
  digest: sha256:7d7f4938f98b4a70e918cc768d2109f6d1080d5a8944b829a5bceda49b24cabc # tag 51f8cc4b-p907d86f3-rfb46e215e
