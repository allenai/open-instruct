# H104 p1-a (tpu-worker, 2026-10-21; mk_h103_h104.py): H089's olmo3-7b-s0 at 4x batch (64 rows, 2942 steps,
# peak 1e-4), r2 data shim 8:2:128:32:4, candidate A: 8x8x8, ici_fsdp_parallelism=16 ici_tensor_parallelism=8 ici_context_parallelism=4 allow_split_physical_axes=true; a 30-step P1 smoke (scratch, no checkpoint).
# Olmo 3 7B (allenai/Olmo-3-1025-7B@a81bae42) SFT on one 4x4x8 v4 slice with A0''s recipe (ledger H067) and only the
# base swapped: A0''s cleaned Dolci-Think stream, the olmo35 tokenizer and template (Olmo-3-1025-7B's tokenizer.json is
# identical to dolma2-tokenizer-olmo35@8b971706's), prefix labels, 65,536-token sequences, 16 rows = 1,048,576 tokens/step,
# 11,768 steps, LR 5e-5, 3% warmup from step one then linear to 0, AdamW (0.9, 0.95) wd 0, clip 1.0, LM-head z-loss 1e-5.
# Image: the restore-fix image (resumes skip the batches already trained), the same one A0''s 8x8x8 successors use.
#   kubectl --context gke_ai2-olmo_us-central2-b_gke-tpu-v4 apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: olmo

resources:
- jobset.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: h104-p1-a-launcher
  files:
  - train_sft.sh # a copy of ../../olmo3-sft/train_sft.sh (kustomize loads no files from outside this directory); keep them identical
- name: h104-p1-a-env
  literals:
  # Set a unique name before launching; do not resume or overwrite the reference run.
  - RUN_NAME=olmo3-7b-sft-h104-p1-a
  - OUTPUT_DIR=gs://ai2-olmo-dev/post-training/scratch
  # allenai/Olmo-3-1025-7B converted 2026-10-07 with MaxText's to_maxtext (model_name=olmo3-7b, bf16, as the HF weights);
  # its safetensors (sha256 0490d666, e127ea47, f3ddff10) are unchanged from 7941e113 through a81bae42. 4K loss parity passed on it (#1933).
  - LOAD_PARAMETERS_PATH=gs://ai2-olmo-dev/post-training/checkpoints/olmo3-1025-7b/0/items
  - MAXTEXT_R2_DATA_EMULATION=8:2:128:32:4
  - TOKENIZER_PATH=/mnt/post-training/tokenizers/olmo35-8b971706-h045
  - TRAIN_FILES=/mnt/post-training/data/h067/a0prime-s0/*.parquet
  - MODEL_NAME=olmo3-7b
  - MAXTEXT_SFT_LABELS=prefix
  - TOTAL_DEVICES=512
  - GLOBAL_BATCH=64
  - PER_DEVICE_BATCH=0.125
  - SEQ_LEN=65536
  - LR=1e-4
  - WARMUP_FRAC=0.03
  - LR_SCHEDULE_STEPS=2942
  - STEPS=30
  - NUM_EPOCH=2
  - DATA_SEED=0
  # FSDP 16 x tensor 8: batch shards over fsdp (16 sequences, A0''s data layout), one 64K sequence over 8 chips.
  # remat_policy=minimal (A0' uses full): 8.85 s/step vs 10.12 with full, the same batches (H089 P5, Amendment 1).
  # The vocabulary (100,278) does not divide by 8, so the vocab axis is replicated across the tensor group (zero-padding
  # it costs +3.2 nats/token; see README Traps).
  - EXTRA_ARGS=logical_axis_rules=[['vocab',[]],['activation_vocab',[]]] sharding_tolerance=0.05 warmup_step_offset=1 z_loss_multiplier=1e-5 enable_checkpointing=true checkpoint_period=100000 max_num_checkpoints_to_keep=2 ici_fsdp_parallelism=16 ici_tensor_parallelism=8 ici_context_parallelism=4 allow_split_physical_axes=true num_vocab_tiling=16 remat_policy=minimal attention=flash sa_block_q=512 sa_block_kv=512 sa_block_kv_compute=512 sa_block_q_dkv=512 sa_block_kv_dkv=512 sa_block_kv_dkv_compute=512
  - LIBTPU_INIT_ARGS=--xla_enable_async_all_gather=true --xla_tpu_scoped_vmem_limit_kib=16384
  - TPU_MEGACORE=MEGACORE_DENSE
  - MAXTEXT_LOG_BATCH_HASH=1 # per-step batch hashes in the log, to check a resume against A0''s batches

images:
- name: us-docker.pkg.dev/ai2-olmo/olmo/maxtext-posttrain
  newTag: 51f8cc4b-p907d86f3-rfb46e215e-bs3ec936c3
