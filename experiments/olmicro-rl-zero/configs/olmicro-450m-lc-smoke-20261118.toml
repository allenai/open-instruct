# Native 450m long-context MILES/Core/SGLang lifecycle smoke (tools/make_size_smoke_config.py from olmicro-2.7b-math-smoke-20261118-b).
# Gates: graph/eager probe, initial weight equality, finite nonzero gradients,
# checkpoint 5 restored in a separate process for update 6. Refresh publication, R1 data, FLA config cache.
# trainer.gpus must stay 2: native_smoke.py requires checkpoint world_size == 2.
schema_version = 1
name = "olmicro-450m-lc-smoke-20261118"

[model]
# allenai/olmicro-450m-base@stage3-step0047684 (long-context final), SHA256SUMS verified 2026-11-18.
source = "/weka/oe-adapt-default/jacobm/olmicro/models/olmicro-450m-base/stage3-step0047684"
format = "hf"

[output]
root = "/weka/oe-adapt-default/jacobm/olmicro/runs/olmicro-450m-lc-smoke-20261118"
export_hf = false

[launch]
memory = "128 GiB"
shared_memory = "32 GiB"
workspace = "ai2/olmo3p5-training"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "urgent"
min_runtime = "2h"
timeout = "2h"
auto_resume = true
max_retries = 0
gpus_per_replica = 4

[[launch.weka_mounts]]
weka = "oe-adapt-default"
mount_path = "/weka/oe-adapt-default"

[launch.secrets]
WANDB_API_KEY = "jacobm_WANDB_API_KEY"
HF_TOKEN = "jacobm_HF_TOKEN"

[launch.env]
OI_NATIVE_LIFECYCLE_SMOKE = "1"
OI_NATIVE_GRAPH_PROBE = "1"
OI_NATIVE_SMOKE_EVAL_SOURCE = "/weka/oe-adapt-default/jacobm/olmicro/data/dolci-math-base-r1-v1/eval-smoke.jsonl"
MILES_SERVING_STARTUP_TIMEOUT_SECONDS = "900"
MILES_HYBRID_NATIVE = "1"
MILES_HYBRID_BRIDGE = "0"
SGLANG_EXTERNAL_MODEL_PACKAGE = ""
MILES_HYBRID_REFERENCE_BACKBONE = "0"
# FLA config cache (runs/warmup-fix-notes-20261118.md); print flag shows what still autotunes.
FLA_CACHE_MODE = "default"
FLA_CONFIG_DIR = "/weka/oe-adapt-default/jacobm/olmicro/fla-configs/b300-fla0.5.2-v1"
TRITON_PRINT_AUTOTUNING = "1"

[data]
prompt_data = "/weka/oe-adapt-default/jacobm/olmicro/data/dolci-math-base-r1-v1/train.jsonl"
# The lifecycle smoke copies the first 8 rows of OI_NATIVE_SMOKE_EVAL_SOURCE to this path.
eval_prompt_data = ["math_smoke", "/weka/oe-adapt-default/jacobm/olmicro/runs/olmicro-450m-lc-smoke-20261118/inputs/eval8.jsonl"]
reward_config = "/weka/oe-adapt-default/jacobm/olmicro/data/dolci-math-base-r1-v1/verifiers.json"
seed = 1
shuffle = true

[training]
# On in the smoke only, so every update has a nonzero gradient for the smoke's grad_norm gate.
filter_zero_std_groups = true
num_rollouts = 6
skip_eval_before_train = false
eval_interval = 1
save_checkpoints = true
save_interval = 1

[trainer]
gpus = 2
trainer_num_nodes = 1
expert_parallel_size = 1
micro_batch_size = 1
sequence_packing = true
packing_max_tokens = 16384
activation_recompute = true

[inference]
placement_mode = "disaggregated"
gpus = 2
rollout_tensor_parallel_size = 1
rollout_batch_size = 4
samples_per_prompt = 8
global_batch_size = 32
# 512 prompt + 8,192 response: long enough to exercise refresh continuation, short enough for a quick smoke.
max_response_length = 8192
max_context_length = 8704
radix_cache = false
check_weight_update_equal = true
update_weight_buffer_size = 1073741824

[optimizer]
learning_rate = 0.000001
lr_decay_style = "constant"
lr_warmup_iters = 0
weight_decay = 0.0
kl_loss_coef = 0.0
entropy_coef = 0.0
eps_clip = 0.2
eps_clip_high = 0.272

[tracking]
wandb_mode = "online"
wandb_team = "ai2-llm"
wandb_project = "open_instruct_internal"
wandb_group = "olmicro-450m-lc-smoke-20261118"

[core]
# Refresh requires 0; full publication audits run at startup instead.
diagnostic_interval = 0
# allenai/olmicro-450m-base HF bucket stage3/checkpoints/step0047684/config.json, SHA256SUMS verified.
model_config = "/weka/oe-adapt-default/jacobm/olmicro/models/olmicro-450m-base/olmo-core/stage3-step0047684/config.json"
attention_backend = "flash_4"
fp32_lm_head = false
compile_model = false
checkpoint_keep_last = 3
publication_mode = "refresh"
engine_drain_timeout = 1800.0
router_aux_loss_weight = 0.0
router_z_loss_weight = 0.0

[miles]
debug_exit_after_rollout = 5
sglang_dtype = "bfloat16"
sglang_disable_cuda_graph = false
sglang_cuda_graph_backend_decode = "full"
sglang_cuda_graph_max_bs_decode = 16
sglang_cuda_graph_backend_prefill = "disabled"
sglang_chunked_prefill_size = -1
sglang_attention_backend = "triton"
sglang_linear_attn_backend = "triton"
sglang_linear_attn_decode_backend = "triton"
sglang_linear_attn_prefill_backend = "triton"
sglang_mem_fraction_static = 0.35
sglang_max_running_requests = 16
sglang_server_concurrency = 16
async_max_concurrent_samples = 16
async_data_buffer_capacity_factor = 1.0
rollout_submission_granularity = "group"
wandb_random_suffix = false
adam_beta1 = 0.9
adam_beta2 = 0.999
rollout_temperature = 1.0
rollout_top_p = 1.0
rollout_seed = 1
seed = 1
rollout_max_prompt_len = 512
# R1 template (tools/format_probe.py): stop when the base model starts a new "User:" turn.
rollout_stop = ["\nUser:"]
disable_grpo_std_normalization = true
calculate_per_token_loss = true
tis_clip = 2.0
eval_temperature = 1.0
eval_top_p = 0.95
n_samples_per_eval_prompt = 1
eval_max_response_len = 8192

[async]
fully_async = true
max_weight_staleness = 12
async_unused_samples_handler = "retry"
off_policy_correction = "tis"
