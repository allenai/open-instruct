# OLMo 3.5 Small ("Hero Small", A4B, olmo35-small-e256k8-sh2x) on B300: 7 nodes / 56 GPUs.
# 16 trainer GPUs (2 nodes x EP8), 39 TP1 engines at admission R=224, 1 Qwen3-32B judge.
# Derived from eight-node.toml for a matched test with one fewer inference node.
# The eight-node rc02-v10 run (Beaker 01M867HA5AET397YVXMA6GE0KJ) was trainer-bound in
# updates 31-40 at batch 2,048, with finished generation backed up on the producer.
# The seven-node layout has been checked with plan. Measure throughput and policy lag on GPUs.
# See docs/miles/olmo35-small.md and configs/miles/examples/README.md.
# Replace YOUR_USERNAME and input paths, select a workspace, and inspect plan before launching.
schema_version = 1
name = "seven-node"

[model]
# H203 SFT export (read-only shared checkpoint).
source = "/weka/olmo-3p5-post-checkpoints/abhishekr/a4b-gpu/a4bgpu-s34521/hf_step18410"

[output]
# GPU run outputs go on olmo-3p5-post-checkpoints, not oe-training-default (which filled during
# timing4). Each native save is ~0.85 TB; check free space before launch (docs/miles/olmo35-small.md).
root = "/weka/olmo-3p5-post-checkpoints/YOUR_USERNAME/miles/small-seven-node"
# Sample 10% of rollouts to disk for per-verifier analysis.
rollout_sample_rate = 0.1
export_hf = false

[launch]
# Measured in ai2/olmo-instruct (ai2/open-instruct-dev had no holmes allocation at the time).
# Select a workspace with an allocation on the chosen cluster before submitting.
workspace = "ai2/olmo-instruct"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "high"
# Historical budget used the older batch without saves; remeasure current wall time and save cost.
min_runtime = "3h"
# Inherit the eight-node timeout. Measure this layout before setting a multi-day budget.
# Beaker cancels a job at its timeout (autoResume does not requeue it); preemptions auto-resume
# from the last save. ai2/holmes has no maximum job duration.
timeout = "120h"
auto_resume = true
gpus_per_replica = 8
memory = "1500 GiB"
# Ray sizes the object store from /dev/shm (and RAY_DEFAULT_OBJECT_STORE_MAX_MEMORY_BYTES below).
shared_memory = "400 GiB"

[launch.coordination]
heartbeat_timeout = 480
startup_timeout = 3600

[[launch.weka_mounts]]
weka = "oe-training-default"
mount_path = "/weka/oe-training-default"

[[launch.weka_mounts]]
weka = "oe-adapt-default"
mount_path = "/weka/oe-adapt-default"

[[launch.weka_mounts]]
weka = "olmo-3p5-post-checkpoints"
mount_path = "/weka/olmo-3p5-post-checkpoints"

# SFT exports under olmo-3p5-post-checkpoints can be symlinks into this bucket (e.g. the H258
# export's weights, config and tokenizer). Without the mount, model load fails at runtime.
[[launch.weka_mounts]]
weka = "olmo-3p5-checkpoints"
mount_path = "/weka/olmo-3p5-checkpoints"

[launch.env]
# Ray logical capacity per node; the actor reservations below are not thread counts.
OI_MILES_RAY_CPUS = "64"
# Ray object store cap (Ray default 200e9; also capped at 0.95 x /dev/shm). Routing-replay payloads of
# completed groups live in the producer node's object store; at 200 GB it spilled and delivery stalled.
RAY_DEFAULT_OBJECT_STORE_MAX_MEMORY_BYTES = "360000000000"
OI_MILES_CODE_FAILURE_POLICY = "zero"
OI_MILES_JUDGE_FAILURE_POLICY = "zero"
SGLANG_TIMEOUT_KEEP_ALIVE = "60"
NCCL_SOCKET_IFNAME = "ib"
NCCL_IB_HCA = "^=mlx5_bond_0"
OLMO_SGLANG_CORE_COMPAT = "rounding"
# Tuned fused-MoE tiles (E=256,N=3072, B300) committed in configs/miles/moe_configs/;
# the image copies configs/miles to /opt/core-rl/configs/miles.
SGLANG_MOE_CONFIG_DIR = "/opt/core-rl/configs/miles/moe_configs"

[launch.secrets]
BEAKER_TOKEN = "YOUR_USERNAME_BEAKER_TOKEN"
HF_TOKEN = "YOUR_USERNAME_HF_TOKEN"
# Beaker secret name, not the token value; required by the H196 code verifier. This is the shared
# code-service token in ai2/olmo-instruct; in another workspace, substitute that workspace's secret.
CODE_EXECUTION_TOKEN = "robertb_MILES_PR2178_CODE_EXECUTION_TOKEN"

[data]
# Exclude over-budget training prompts and record per-source counts.
over_length = "exclude"
# robertb's H196 prepared Dolci inputs (read-only; 84,577 rendered rows, no held-out split).
prompt_data = "/weka/olmo-3p5-post-checkpoints/robertb/miles/h196-dolci-control-20261113/inputs/dolci.jsonl.gz"
reward_config = "/weka/olmo-3p5-post-checkpoints/robertb/miles/h196-dolci-control-20261113/inputs/verifiers.json"
seed = 17
shuffle = true

[training]
learning_rate = 6e-6
# Zero-std group filtering stays on (default), as in the measured runs.
# Short starting budget; extend only after measuring runtime, save cost and recovery.
num_rollouts = 30
# Recovery target: roughly 1–2h; current-batch wall time still needs qualification.
save_interval = 10
skip_eval_before_train = true

[trainer]
fp32_lm_head = true
gpus = 8
expert_parallel_size = 8
sequence_packing = true
packing_max_tokens = 34816
trainer_num_nodes = 2

[inference]
placement_mode = "disaggregated"
gpus = 39
rollout_batch_size = 256
samples_per_prompt = 8
global_batch_size = 2048
max_response_length = 32768
max_context_length = 34816
profile = "generic"
sglang_disable_radix_cache = true
# Admission R=224 (as four-node.toml) needs core.refresh_request_timeout = 3600 s.
sglang_max_running_requests = 224
sglang_server_concurrency = 448
sglang_cuda_graph_backend_decode = "full"
sglang_cuda_graph_max_bs_decode = 224
sglang_cuda_graph_backend_prefill = "disabled"
sglang_chunked_prefill_size = 8192
# No sglang_max_total_tokens key: the KV pool is memory-sized (3,919,232 tokens at 0.92 next to
# 256 KDA slots and 135 GB of weights), as in four-node.toml.
sglang_max_mamba_cache_size = 256
sglang_mem_fraction_static = 0.92
# Full-attention layers (5 of 40) on trtllm_mha; KDA layers are unchanged.
sglang_attention_backend = "trtllm_mha"

[tracking]
wandb_mode = "offline"
wandb_team = "ai2-llm"
wandb_project = "open-instruct-miles"
wandb_group = "small-seven-node"

[core]
# Grade the presented response; process/format exceptions must be explicitly declared.
reward_final_answer_only = true
# Set to "none" only when using an explicitly non-thinking policy/template.
reward_reasoning_mode = "required"
max_policy_lag = 12
# A response cut off at max_response_length scores 0 (capped = wrong).
reward_zero_truncated = true
# Keep the latest two native saves plus a permanent milestone every 100 updates and the final save
# (~0.85 TB each): a 660-update run peaks near (2 + 6 + 1) x 0.85 = ~7.7 TB.
checkpoint_keep_last = 2
checkpoint_keep_every = 100
save_final_checkpoint = true
# Optional resumable wall-clock stop, only for clusters or budgets that cap job length: saves at the
# next completed collection and exits with workflow "stopped"; resubmit the unchanged TOML to continue.
# max_run_seconds = 79200.0
publication_mode = "refresh"
# Matches refresh_request_timeout for evaluation and final HF export drains (terminal refresh cleanup cancels unused generation).
engine_drain_timeout = 3600.0
engine_update_timeout = 1800.0
# Headroom for 32K responses at R=224 (1800 s timed out on 4 nodes). A timeout discards the whole group.
refresh_request_timeout = 3600.0
pipeline_observation_interval = 2.0
router_aux_loss_weight = 0.0
router_z_loss_weight = 0.0
scoring_check_interval = 0

[miles]
# Keep active-request KV/recurrent state across weight updates.
pause_generation_mode = "in_place"
# Weight contributing tokens equally across responses.
calculate_per_token_loss = true
# Trainer ranks only; do not change the serving allocator.
train_env_vars = { PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True" }
# Rust response transport; Core owns request retries and weight-ready membership.
use_miles_router = false
router_policy = "round_robin"
router_disable_retries = true
router_disable_health_check = true
router_disable_circuit_breaker = true
use_distributed_post = true
http_post_actors_per_node = 16
http_post_num_cpus = 1.0
rollout_executor_num_cpus = 2.0
# Keep the eight-node completed-buffer limit of 1.5 collections (384 groups).
# A larger buffer caused routing-replay payloads to fill the Ray object store in the eight-node trial.
async_data_buffer_capacity_factor = 1.5
sglang_enable_metrics = true
use_rollout_routing_replay = true

[async]
fully_async = true
# 224 unfinished samples per engine (= admission R) x 39 engines.
async_max_concurrent_samples = 8736

[compiler_cache]
shared_root = "/weka/oe-training-default/open-instruct-compiler-cache/tmp-7d"

# Optional HF snapshots for offline evals (<root>/eval-snapshots/update-NNNNNNNN/hf, ~145 GB each)
# at updates 50, 100, ... and the final update. Snapshot export is a synchronous trainer collective;
# a failed export fails training. It needs an image built from main at or after #2293 (writer-only
# HF export, miles 9eff46a4); older images can run out of memory during the export. Not yet
# qualified on Small. The in-run evaluator below is unqualified for Small; it must disable the
# prefill CUDA graph (KDA prefill-graph padding bug). Run the standard panel offline on the
# snapshots. See docs/miles/background-evaluation.md.
# To enable, uncomment the block and delete training.skip_eval_before_train (it selects shared-engine
# evaluation, which conflicts with background mode).
# [evaluation]
# mode = "background"
# interval = 50
# initial = false
# final = true
# image = "01M6J0KMAD3CXVGT07V1BHR1VH"
# revision = "ba0ff700e8f9b301cfd8ed5fd462df9d83dddfe1"
# gpus = 1
# cluster = "ai2/holmes"
# submit_timeout = 30
# timeout = "6h"
# provider_kwargs = { profile = "generic", context_length = 34816, cuda_graph_backend_prefill = "disabled" }
#
# [[evaluation.tasks]]
# task = "ifeval"
# generation = { temperature = 1.0, top_p = 0.95, max_tokens = 32768, num_samples = 1 }

[judges.general]
mode = "managed"
backend = "sglang"
model = "Qwen/Qwen3-32B"
revision = "9216db5781bf21249d130ec9da846c4624c16137"
chat_template = "qwen3-no-thinking"
max_context_length = 131072
context_extension = "qwen3-yarn-128k"
cuda_graphs = true
gpus = 1
tensor_parallel_size = 1
timeout = 600
max_concurrent_calls = 32
# robertb's prepared judge (read-only; the judge server only reads prepared.json).
prepared_dir = "/weka/oe-adapt-default/robertb/olmo-miles/trial-data/dolci-think-20260908/judge"

[rubrics.quality]
profile = "open-instruct/general-quality"
max_response_tokens = 2048
temperature = 1.0

[rubrics.reference_quality]
profile = "open-instruct/general-quality_ref"
max_response_tokens = 2048
temperature = 1.0

# Binding names are the hashed verifier ids in the H196 verifiers.json above.
[judging.bindings.wb_ea066c35a7a5568b4cb168aff3382d4dd2694f5ce6ad5574c7ce649ac6b61224]
judge = "general"
rubric = "quality"

[judging.bindings.wb_6f03833c91e17e0568b3d089ad5c2b0100a91fe6e9402e63119bc8e6d804b68d]
judge = "general"
rubric = "reference_quality"
