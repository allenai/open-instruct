# EP2/CP2 Tiny trainer + one TP1 serving engine: three B300s, four updates.
# Synthetic sibling rewards exercise gradients even with the short response cap.
# Replace YOUR_USERNAME and inspect `plan` before launching.
schema_version = 1
name = "cp2-smoke"

[model]
source = "/weka/olmo-3p5-post-checkpoints/abhishekr/s-c-gpu/s-c-noag-s34521/hf_step63494"

[output]
root = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/runs/cp2-smoke"
export_hf = false
rollout_sample_rate = 1.0

[launch]
workspace = "ai2/olmo-instruct"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "high"
min_runtime = "30m"
timeout = "1h"
auto_resume = false
gpus_per_replica = 3
memory = "512 GiB"
shared_memory = "64 GiB"

[[launch.weka_mounts]]
weka = "oe-training-default"
mount_path = "/weka/oe-training-default"

[[launch.weka_mounts]]
weka = "olmo-3p5-post-checkpoints"
mount_path = "/weka/olmo-3p5-post-checkpoints"

[launch.env]
OI_MILES_RAY_CPUS = "32"
OLMO_SGLANG_CORE_COMPAT = "rounding"

[data]
over_length = "exclude"

[[data.tasks]]
task = "gsm8k-less-noise"
train_count = 32
eval_count = 1

[training]
num_rollouts = 4
learning_rate = 6e-6
filter_zero_std_groups = false
save_checkpoints = false
skip_eval_before_train = true

[trainer]
gpus = 2
expert_parallel_size = 2
context_parallel_size = 2
sequence_packing = true
packing_max_tokens = 2048

[inference]
placement_mode = "disaggregated"
gpus = 1
profile = "generic"
rollout_batch_size = 4
samples_per_prompt = 2
global_batch_size = 8
max_response_length = 512
max_context_length = 2048
sglang_max_running_requests = 8
sglang_server_concurrency = 8
sglang_max_total_tokens = 16384
sglang_max_mamba_cache_size = 16
sglang_mem_fraction_static = 0.6
sglang_disable_radix_cache = true
sglang_cuda_graph_backend_decode = "disabled"
sglang_cuda_graph_backend_prefill = "disabled"
sglang_attention_backend = "fa4"
check_weight_update_equal = true

[tracking]
wandb_mode = "offline"
wandb_project = "open-instruct-miles"
wandb_group = "cp2-smoke"

[core]
publication_mode = "barrier"
scoring_check_interval = 1
replay_diagnostics = true
router_aux_loss_weight = 0.0
router_z_loss_weight = 0.0
reward_zero_truncated = false
max_run_seconds = 2400

[miles]
custom_rm_path = "scripts.miles.mechanics_reward.score"
calculate_per_token_loss = true
use_rollout_routing_replay = true
train_env_vars = { PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True" }

[compiler_cache]
shared_root = "/weka/oe-training-default/open-instruct-compiler-cache/tmp-7d"
