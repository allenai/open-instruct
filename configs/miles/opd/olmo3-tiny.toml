# Dense Olmo 3 learner, independently configured Qwen teacher; two updates.
schema_version = 1
name = "core-opd-dense-tiny-20260914"

[model]
source = "/weka/oe-training-default/robertb/open-instruct/checkpoints/olmo3-think-sft-6ff857587e040d6d523a3d5f3a56e918f5401d66"
format = "hf"

[output]
root = "/weka/oe-training-default/robertb/open-instruct/runs/core-opd-dense-tiny-20260914"
export_hf = true

[launch]
workspace = "ai2/open-instruct-dev"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "urgent"
min_runtime = "1h"
timeout = "3h"
auto_resume = false
gpus_per_replica = 4

[[launch.weka_mounts]]
weka = "oe-training-default"
mount_path = "/weka/oe-training-default"

[data]
seed = 17
shuffle = true

[[data.tasks]]
task = "gsm8k"
train_count = 16
eval_count = 8

[training]
algorithm = "opd"
num_rollouts = 2
skip_eval_before_train = false
eval_interval = 2
save_checkpoints = true
save_interval = 1

[trainer]
backend = "olmo_core"
gpus = 2
trainer_num_nodes = 1
expert_parallel_size = 1
micro_batch_size = 1
activation_recompute = true
sequence_packing = true
packing_max_tokens = 6144
trainer_flash_attention_version = 4

[inference]
placement_mode = "disaggregated"
gpus = 1
rollout_tensor_parallel_size = 1
rollout_batch_size = 4
samples_per_prompt = 2
global_batch_size = 8
max_response_length = 1024
max_context_length = 6144
sglang_server_concurrency = 8
sglang_max_running_requests = 8
sglang_max_total_tokens = 65536
sglang_max_mamba_cache_size = 128
sglang_mem_fraction_static = 0.6
radix_cache = false
sglang_cuda_graph_backend_decode = "full"
sglang_cuda_graph_max_bs_decode = 8
sglang_cuda_graph_backend_prefill = "disabled"
sglang_sampling_backend = "pytorch"
sglang_attention_backend = "triton"
check_weight_update_equal = true
update_weight_buffer_size = 1073741824

[optimizer]
learning_rate = 0.000001
lr_decay_style = "constant"
lr_warmup_iters = 0
weight_decay = 0.0
adam_beta1 = 0.9
adam_beta2 = 0.95
adam_eps = 0.00000001
clip_grad = 1.0
kl_loss_coef = 0.0
entropy_coef = 0.0
eps_clip = 0.2
eps_clip_high = 0.28

[tracking]
wandb_mode = "offline"
wandb_project = "olmo-rl-comparison"
wandb_group = "core-opd-qualification"

[runtime]
row_specialization = "dynamic"

[core]
diagnostic_interval = 1
max_train_rollout_logprob_abs_diff = 0.05
weight_sync_mode = "flattened"

[miles]
use_miles_router = true
rollout_temperature = 1.0
rollout_seed = 17
rollout_max_prompt_len = 2048
seed = 17
disable_grpo_std_normalization = true

[teacher]
source = "Qwen/Qwen3.5-9B"
revision = "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
gpus = 1
tensor_parallel_size = 1
max_context_length = 8192
concurrency = 4
chat_template_kwargs = { enable_thinking = false }

[distillation]
alignment = "exact_text_spans"
kl_coef = 1.0
