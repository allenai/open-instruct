# Olmo 3.5 hero-small SFT on TPU, the H045 anchor recipe (olmo35-small-4t-emo base, Dolci-Think, the Olmo 3.5
# template with H045's prefix labelling, 65,536-token sequences, 1,048,576 tokens/step, LR 5e-5, 3% warmup (from step one, as OLMo-core) then
# linear to 0 over 11,768 steps, AdamW wd 0, clip 1.0, router load-balancing 0.01 and router z-loss 1e-5 summed over MoE layers as OLMo-core does, LM-head z-loss 1e-5, EMO off). MoE buffers hold 2x the mean expert load (dropless needs 32.9 of 31.75 GiB at 64K).
# STEPS < LR_SCHEDULE_STEPS runs the start of that schedule for loss parity against H045's W&B curve.
#   kubectl --context gke_ai2-olmo_us-central2-b_gke-tpu-v4 apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: olmo

resources:
- jobset.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: olmo35-sft-launcher
  files:
  - train_sft.sh # a copy of ../olmo3-sft/train_sft.sh (kustomize loads no files from outside this directory); keep them identical
- name: olmo35-sft-env
  literals:
  - RUN_NAME=olmo35-sft-h045-tpu-parity-c1
  - OUTPUT_DIR=gs://ai2-olmo-dev/post-training/runs
  # OLMo-core step5961 converted with o35/convert_olmocore_to_maxtext.py (fp32 masters, padded 100352 vocab).
  - LOAD_PARAMETERS_PATH=gs://ai2-olmo-dev/post-training/checkpoints/olmo35-small-4t-emo-step5961/0/items
  # allenai/dolma2-tokenizer-olmo35 @8b971706 with open-instruct's olmo35 template, saved by o35/tok_oi35.py.
  - TOKENIZER_PATH=/mnt/post-training/tokenizers/olmo35-8b971706-h045
  - TRAIN_FILES=/mnt/post-training/data/dolci-think-sft-shuf-s0/*.parquet
  - MODEL_NAME=olmo35-tiny
  - MAXTEXT_SFT_LABELS=prefix
  - TOTAL_DEVICES=128
  - GLOBAL_BATCH=16
  - PER_DEVICE_BATCH=0.125
  - SEQ_LEN=65536
  - LR=5e-5
  - WARMUP_FRAC=0.03
  - LR_SCHEDULE_STEPS=11768
  - STEPS=600
  - NUM_EPOCH=2
  - DATA_SEED=0
  # FSDP 4 x expert 4 x tensor 4 x context 2 = 128 chips; batch shards over fsdp x expert (16 sequences), one 64K
  # sequence per 8 chips. Tensor parallelism stops at 4 (the full-attention layers have 4 KV heads); context load
  # balancing is off so packed rows keep their order and segment masks. Expert parallelism, per-layer remat and
  # megablox follow olmo-gcp-infra examples/olmo35-maxtext (pure FSDP all-gathers every MoE layer's experts).
  - EXTRA_ARGS=override_model_config=true moe_aux_loss_reduction=sum warmup_step_offset=1 z_loss_multiplier=1e-5 emo_enabled=false enable_checkpointing=true checkpoint_period=100000 ici_fsdp_parallelism=4 ici_expert_parallelism=4 ici_tensor_parallelism=4 ici_context_parallelism=2 context_parallel_load_balance=false allow_split_physical_axes=true shard_exp_on_fsdp=False ragged_buffer_factor=2.0 sharding_tolerance=0.3 olmoe3_per_layer_remat=true sparse_matmul=true megablox=true use_tokamax_kda=false num_vocab_tiling=16 remat_policy=full
  - LIBTPU_INIT_ARGS=--xla_enable_async_all_gather=true
  # An environment variable, not a libtpu flag: v4 megacore frees ~1 GiB of HBM.
  - TPU_MEGACORE=MEGACORE_DENSE

images:
- name: us-docker.pkg.dev/ai2-olmo/olmo/maxtext-posttrain
  newTag: 51f8cc4b-pf387f341
