name: MILES contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'open_instruct/miles/**'
      - 'open_instruct/test_miles*.py'
      - 'tests/miles/**'
      - 'tests/miles_eval/**'
      - 'scripts/miles/**'
      - 'runtime/miles/**'
      - 'configs/miles/**'
      - 'docs/miles/**'
      - '.github/workflows/miles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: 8-Core-XL-Runner-Ubuntu-Latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.8.6'
      - run: uv sync --frozen
      - name: Check integration, scripts and runtime test style
        run: |
          uv run --frozen ruff check open_instruct/miles scripts/miles tests/miles tests/miles_eval
          uv run --frozen ruff format --check open_instruct/miles scripts/miles tests/miles tests/miles_eval
      - name: Check CPU contracts and generated references
        env:
          OMP_NUM_THREADS: '1'
        run: |
          uv run --frozen pytest open_instruct/test_miles*.py
          uv run --frozen python -m scripts.miles.generate_docs --check
      - name: Check application integration types
        run: uv run --frozen ty check open_instruct/miles --config 'src.exclude = []'
