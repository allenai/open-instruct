# Overfit diagnostic, Core arm: 16 fixed GSM8K prompts revisited every two updates
# for 60 updates on the full-SFT MoE checkpoint through the async refresh/TIS path.
# A correct trainer drives training reward toward 1.0; held-out is a side view.
# 3 GPUs: two EP2 trainers plus one TP1 engine. Same checkpoint, LR, batch shape,
# response budget and verifier as the Megatron arm (runs/overfit-gsm8k-megatron-20260915.toml
# in the olmo-miles parity worktree). Diagnostic run: no checkpoints, no export.
schema_version = 1
name = "overfit-gsm8k-core-20260915"

[model]
source = "/weka/oe-training-default/robertb/open-instruct/gsm8k-parity/20260910-core-megatron-v1/hf"
format = "hf"

[output]
root = "/weka/oe-training-default/robertb/open-instruct/runs/overfit-gsm8k-core-20260915"
export_hf = false

[launch]
workspace = "ai2/open-instruct-dev"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "urgent"
min_runtime = "4h"
timeout = "6h"
auto_resume = false
gpus_per_replica = 3

[[launch.weka_mounts]]
weka = "oe-training-default"
mount_path = "/weka/oe-training-default"

[launch.env]
SGLANG_TIMEOUT_KEEP_ALIVE = "60"

[launch.secrets]
WANDB_API_KEY = "robertb_WANDB_API_KEY"

[data]
seed = 17
shuffle = true

# 16 training prompts; 8 prompts x 4 responses per update, so every prompt
# recurs every second update (30 passes over 60 updates). 32 disjoint held-out rows.
[[data.tasks]]
task = "gsm8k"
train_count = 16
eval_count = 32

[training]
num_rollouts = 60
skip_eval_before_train = false
eval_interval = 20
save_checkpoints = false

[trainer]
gpus = 2
trainer_num_nodes = 1
expert_parallel_size = 2
micro_batch_size = 1
sequence_packing = true
packing_max_tokens = 6144
activation_recompute = false
trainer_flash_attention_version = 4

[inference]
placement_mode = "disaggregated"
gpus = 1
rollout_tensor_parallel_size = 1
rollout_batch_size = 8
samples_per_prompt = 4
global_batch_size = 32
max_response_length = 4096
max_context_length = 6144
sglang_server_concurrency = 16
sglang_max_running_requests = 16
sglang_max_total_tokens = 131072
sglang_max_mamba_cache_size = 128
sglang_mem_fraction_static = 0.6
radix_cache = true
mamba_radix_cache_strategy = "extra_buffer"
sglang_cuda_graph_backend_decode = "full"
sglang_cuda_graph_max_bs_decode = 16
sglang_cuda_graph_backend_prefill = "disabled"
sglang_sampling_backend = "pytorch"
sglang_attention_backend = "triton"
check_weight_update_equal = true
update_weight_buffer_size = 1073741824

[optimizer]
learning_rate = 0.000001
lr_decay_style = "constant"
lr_warmup_iters = 0
weight_decay = 0.0
adam_beta1 = 0.9
adam_beta2 = 0.95
adam_eps = 0.00000001
clip_grad = 1.0
kl_loss_coef = 0.0
entropy_coef = 0.0
eps_clip = 0.2
eps_clip_high = 0.28

[tracking]
wandb_mode = "online"
wandb_team = "ai2-llm"
wandb_project = "olmo-rl-comparison"
wandb_group = "overfit-gsm8k-20260915"

[runtime]
row_specialization = "dynamic"

[core]
max_train_rollout_logprob_abs_diff = 0.05
publication_mode = "refresh"
refresh_request_timeout = 1800.0
engine_drain_timeout = 900.0
scoring_pass_required = false
scoring_check_interval = 20
pipeline_observation_interval = 2.0
router_aux_loss_weight = 0.01
router_z_loss_weight = 0.00001
stream_moe_export = true
weight_sync_mode = "flattened"
expert_publication = "per_expert"
diagnostic_interval = 0

[miles]
eval_temperature = 0.0
n_samples_per_eval_prompt = 1
sglang_enable_metrics = true
use_rollout_routing_replay = true
use_miles_router = true
sglang_chunked_prefill_size = 8192
rollout_temperature = 1.0
rollout_seed = 17
rollout_max_prompt_len = 2048
seed = 17
disable_grpo_std_normalization = true

[async]
fully_async = true
max_weight_staleness = 2
async_data_buffer_capacity_factor = 1.0
async_unused_samples_handler = "retry"
rollout_submission_granularity = "group"
off_policy_correction = "tis"

[compiler_cache]
enabled = true
shared_root = "/weka/oe-training-default/open-instruct-compiler-cache/tmp-7d"
restore = true
