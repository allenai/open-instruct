# Two-GPU Qwen3-0.6B FSDP recipe exercised on Holmes; see docs/miles/upstream.md.
# Prepare the model and GSM8K JSONL and replace YOUR_USERNAME before launching.
schema_version = 1
name = "upstream-qwen3-grpo-smoke"

[model]
source = "/weka/oe-training-default/YOUR_USERNAME/miles-upstream-smoke/Qwen3-0.6B"
format = "hf"

[output]
root = "/weka/oe-training-default/YOUR_USERNAME/miles-upstream-smoke/fsdp"

[trainer]
backend = "fsdp"
gpus = 1
trainer_num_nodes = 1
bf16 = true
attn_implementation = "flash_attention_2"
dynamic_batching = true
max_tokens_per_gpu = 4096

[inference]
placement_mode = "disaggregated"
gpus = 1
rollout_gpus_per_node = 2
rollout_tensor_parallel_size = 1
rollout_batch_size = 8
samples_per_prompt = 4
global_batch_size = 32
max_response_length = 512
sglang_mem_fraction_static = 0.4
sglang_attention_backend = "flashinfer"
sglang_cuda_graph_max_bs_decode = 32

[data]
prompt_data = "/weka/oe-training-default/YOUR_USERNAME/miles-upstream-smoke/gsm8k-128.jsonl"
input_key = "messages"
label_key = "label"
apply_chat_template = true
apply_chat_template_kwargs = {enable_thinking = false}
rollout_shuffle = true

[training]
num_rollouts = 4
save_interval = 2

[optimizer]
learning_rate = 0.000001
lr_decay_style = "constant"
weight_decay = 0.1
adam_beta1 = 0.9
adam_beta2 = 0.98
kl_loss_coef = 0.0

[miles]
rm_type = "math"
advantage_estimator = "grpo"
rollout_temperature = 1.0
seed = 17
check_weight_update_equal = true
load = "/weka/oe-training-default/YOUR_USERNAME/miles-upstream-smoke/fsdp/checkpoints"
save_debug_rollout_data = "/output/rollout-{rollout_id}.pt"

[launch]
workspace = "ai2/open-instruct-dev"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "high"
min_runtime = 0
timeout = "30m"
auto_resume = false
gpus_per_replica = 2
shared_memory = "32 GiB"

[launch.env]
PYTHONUNBUFFERED = "1"

[[launch.weka_mounts]]
weka = "oe-training-default"
mount_path = "/weka/oe-training-default"
