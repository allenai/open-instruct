# PROPOSAL: inputs/judge preparation, 8-rank FSDP and long-context throughput remain unqualified.
# No automatic submission. See docs/miles-olmo3-pre-rl.md for comparison gates.
# Dense Olmo 3 on Core FSDP; the proposed hardware still needs qualification.
# Replace YOUR_USERNAME/model source before launch; inspect `plan` first.
schema_version = 1
name = "olmo3-think-dolci-200"

[model]
# Stage the pinned Think-DPO snapshot with configs/miles/templates/olmo-thinker.jinja.
# Checkpoint revision: 7b18bf927b430ff06376fdfa5610eb3b1b6a5c38.
source = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/checkpoints/olmo3-7b-think-dpo-oi-template"
format = "hf"

[output]
root = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/runs/olmo3-think-dolci-200"
export_hf = true

[launch]
workspace = "ai2/open-instruct-dev"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "urgent"
min_runtime = "8h"
timeout = "48h"
auto_resume = false
gpus_per_replica = 8

[[launch.weka_mounts]]
weka = "oe-training-default"
mount_path = "/weka/oe-training-default"

[launch.secrets]
WANDB_API_KEY = "YOUR_USERNAME_WANDB_API_KEY"

[data]
# Future prepared artifacts: rebuild with the dense checkpoint tokenizer and the pinned
# olmo_thinker template, preserve source proportions, and remove fixed held-out identities.
seed = 1
shuffle = true
prompt_data = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/data/olmo3-dolci/train.jsonl"
reward_config = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/data/olmo3-dolci/verifiers.json"
eval_prompt_data = [
    "math", "/weka/oe-training-default/YOUR_USERNAME/open-instruct/data/olmo3-dolci/eval-math.jsonl",
    "code", "/weka/oe-training-default/YOUR_USERNAME/open-instruct/data/olmo3-dolci/eval-code.jsonl",
    "ifeval", "/weka/oe-training-default/YOUR_USERNAME/open-instruct/data/olmo3-dolci/eval-ifeval.jsonl",
    "general", "/weka/oe-training-default/YOUR_USERNAME/open-instruct/data/olmo3-dolci/eval-general.jsonl",
]

[training]
num_rollouts = 200
skip_eval_before_train = false
eval_interval = 20
save_checkpoints = true
# Core saves synchronously. Choose a more frequent cadence for recovery.
save_interval = 50

[trainer]
gpus = 8
trainer_num_nodes = 1
expert_parallel_size = 1
micro_batch_size = 1
activation_recompute = true
trainer_flash_attention_version = 4

[inference]
placement_mode = "disaggregated"
gpus = 7
rollout_tensor_parallel_size = 1
# One optimizer update per collection; see the recipe mapping for batch scale.
rollout_batch_size = 64
samples_per_prompt = 8
global_batch_size = 512
max_response_length = 32768
max_context_length = 34816
sglang_server_concurrency = 8
sglang_max_running_requests = 8
# Dense 32-layer MHA uses about 0.5 MiB of BF16 KV per cached token.
# This cap is about 64 GiB, before weights/workspace; qualify on B300.
sglang_max_total_tokens = 131072
sglang_mem_fraction_static = 0.6
sglang_disable_radix_cache = true
sglang_cuda_graph_backend_decode = "disabled"
sglang_cuda_graph_max_bs_decode = 64
sglang_cuda_graph_backend_prefill = "disabled"
sglang_sampling_backend = "pytorch"
sglang_attention_backend = "triton"
check_weight_update_equal = true
update_weight_buffer_size = 1073741824

[optimizer]
learning_rate = 0.000001
lr_decay_style = "constant"
lr_warmup_iters = 0
weight_decay = 0.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 0.00000001
clip_grad = 1.0
kl_loss_coef = 0.0
entropy_coef = 0.0
eps_clip = 0.2
eps_clip_high = 0.272

[tracking]
wandb_mode = "online"
wandb_project = "olmo-rl-comparison"
wandb_group = "olmo3-think-dolci-comparison"

[core]
diagnostic_interval = 20
max_train_rollout_logprob_abs_diff = 0.05
router_aux_loss_weight = 0.0
router_z_loss_weight = 0.0
weight_sync_mode = "flattened"

[miles]
# Match the audited current OI trainer/inference correction; recheck the chosen historical baseline.
use_tis = true
tis_clip = 2.0
tis_clip_low = 0.0
dynamic_sampling_filter_path = "miles.rollout.filter_hub.dynamic_sampling_filters.check_reward_nonzero_std"
eval_temperature = 0.0
n_samples_per_eval_prompt = 1
rollout_temperature = 1.0
rollout_seed = 1
rollout_max_prompt_len = 2048
seed = 1
disable_grpo_std_normalization = true
calculate_per_token_loss = true
use_rollout_routing_replay = false
rollout_top_p = 1.0
rollout_top_k = -1

# Shared compiler artifacts use the existing TTL-managed cache policy.
[compiler_cache]
enabled = true
shared_root = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/compiler-cache/tmp-30d"
restore = true

[judges.general]
mode = "managed"
backend = "sglang"
model = "Qwen/Qwen3-32B"
revision = "9216db5781bf21249d130ec9da846c4624c16137"
gpus = 1
tensor_parallel_size = 1
max_context_length = 40960
max_concurrent_calls = 16
chat_template = "qwen3-no-thinking"
prepared_dir = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/data/olmo3-dolci/judge"

[rubrics.quality]
profile = "open-instruct/general-quality"
max_response_tokens = 2048
temperature = 1.0

[rubrics.reference_quality]
profile = "open-instruct/general-quality_ref"
max_response_tokens = 2048
temperature = 1.0

[judging.bindings."general-quality"]
judge = "general"
rubric = "quality"

[judging.bindings."general-quality_ref"]
judge = "general"
rubric = "reference_quality"
