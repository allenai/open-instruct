name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  merge_group:

jobs:

  unit-tests:
    name: Run unit tests
    runs-on: 8-Core-XL-Runner-Ubuntu-Latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.6"
      - name: Set up Python
        run: uv sync --frozen
      - name: Cache Hugging Face downloads
        run: echo "HF_CACHE_WEEK=$(date --utc '+%Y-%W')" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-v1-${{ env.HF_CACHE_WEEK }}
          restore-keys: |
            hf-cache-v1-
      - name: Install native instruction tokenizer data
        run: |
          echo "NLTK_DATA=$RUNNER_TEMP/nltk_data" >> "$GITHUB_ENV"
          uv run --frozen python -m nltk.downloader --exit-on-error --dir "$RUNNER_TEMP/nltk_data" punkt_tab
      - name: Run unit tests
        run: uv run --frozen pytest
