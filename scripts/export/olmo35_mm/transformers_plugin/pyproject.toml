# Copied from allenai/scaling-ladders@59534d7bda695c8dcbd7eb8e873472cba05c4993 ladders/olmoe3/transformers_plugin/pyproject.toml
[project]
name = "olmoe3-transformers-plugin"
version = "0.0.0"
description = "Hugging Face Transformers registration and conversion CLI for the OLMoE3 KDA + EMo ladder"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ai2-olmo-core",
    "flash-linear-attention==0.5.2; sys_platform == 'linux'",
    "torch>=2.6.0",
    "transformers>=5.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olmoe3_transformers_plugin"]
