# Olmo 3 7B Instruct SFT on one reserved 4x4x8 v4 slice (128 chips, 32 hosts), reproducing the official recipe
# (open-instruct scripts/train/olmo3/7b_instruct_sft.sh, OLMo-core 9e97471 src/scripts/train/sft/OLMo-sft.py):
# start from Olmo-3-7B-Think-SFT, Dolci-Instruct-SFT, 2 epochs, 32768-token sequences, 1M tokens/step
# (32 sequences), AdamW (0.9, 0.95) wd 0, LR 8e-5 linear warmup 3% then linear to 0, clip 1.0.
# Tensor parallelism 4 x FSDP 32 puts one sequence on 4 chips, so per-device batch is 0.25. Olmo 3's vocabulary
# (100278) does not divide by 4, so the vocab axis is replicated across the tensor group (logical_axis_rules);
# zero-padding it to 100352 instead is wrong: the padded logits sit at 0 against often-low real logits
# (+3.2 nats/token on check docs). Replicated-vocab TP=4 matches single-device log-probs to 6e-6.
#   kubectl --context gke_ai2-olmo_us-central2-b_gke-tpu-v4 apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: olmo
resources:
- ../olmo3-sft
patches:
- target: {kind: JobSet, name: olmo3-sft}
  patch: |-
    - op: replace
      path: /metadata/name
      value: olmo3-instruct-sft
    - op: replace
      path: /spec/replicatedJobs/0/template/spec/parallelism
      value: 32
    - op: replace
      path: /spec/replicatedJobs/0/template/spec/completions
      value: 32
    - op: replace
      path: /spec/replicatedJobs/0/template/spec/template/spec/nodeSelector/cloud.google.com~1gke-tpu-topology
      value: 4x4x8
configMapGenerator:
- name: olmo3-sft-env
  behavior: merge
  literals:
  - RUN_NAME=olmo3-7b-instruct-sft-tpu-memtest
  - LOAD_PARAMETERS_PATH=gs://ai2-olmo-dev/post-training/checkpoints/olmo3-7b-think-sft/0/items
  - TRAIN_FILES=/mnt/post-training/data/dolci-instruct-sft-shuf-s0/*.parquet
  - TOTAL_DEVICES=128
  - GLOBAL_BATCH=32
  - PER_DEVICE_BATCH=0.25
  - SEQ_LEN=32768
  - STEPS=10
  - EXTRA_ARGS=logical_axis_rules=[['vocab',[]],['activation_vocab',[]]] sharding_tolerance=0.05 enable_checkpointing=true checkpoint_period=100000 ici_fsdp_parallelism=32 ici_tensor_parallelism=4 num_vocab_tiling=8 remat_policy=full attention=flash sa_block_q=512 sa_block_kv=512 sa_block_kv_compute=512 sa_block_q_dkv=512 sa_block_kv_dkv=512 sa_block_kv_dkv_compute=512
