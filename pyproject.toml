[project]
name = "open-instruct"
version = "0.1.0"
description = "Train open, instruction-following language models"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.10.1",
    "antlr4-python3-runtime==4.11",
    "backoff>=2.2.1",
    "bitsandbytes>=0.44.1; platform_system != 'Darwin'",
    "datasets>=4.0.0",
    "debugpy>=1.8.13",
    # deepspeed is pinned PER CUDA GROUP in [dependency-groups] below: cuda12 stays on the
    # pre-Ulysses-blocklist 0.18 line (proven prod), cuda13 uses >=0.19.0 (permits fa4 on B300).
    "hf-transfer>=0.1.8",
    "litellm>=1.72.0,<1.75.2", # avoid needing backoff https://github.com/BerriAI/litellm/issues/13827
    "matplotlib>=3.9.3",
    "multiprocess<0.70.18", # avoid AttributeError in ResourceTracker.__del__
    "nltk>=3.9.1",
    "numpy>=2",
    "ai2-olmo-core",
    "nvitop>=1.4.2",
    "packaging>=24.2",
    "peft>=0.13.2",
    "pyarrow>=20.0.0",
    "pyyaml>=6.0.2",
    "ray[default]>=2.49.2",
    "setuptools>=75.6.0,<80.0.0",
    "tensorboard>=2.18.0",
    "torch>=2.10.0",
    # torchvision/torchaudio are only needed transitively (via vllm), but they must
    # remain direct dependencies so the CUDA-group source pins apply to them.
    "torchvision>=0.25.0; platform_system == 'Linux'",
    "torchaudio>=2.10.0; platform_system == 'Linux'",
    "transformers>=5.4.0",
    "vllm>=0.19.1; platform_system != 'Darwin'",
    "wandb==0.23.1",
    "langdetect==1.0.9",
    "immutabledict==1.2.0",
    "flash-attn>=2.8.3; platform_system != 'Darwin' and platform_machine != 'aarch64'",
    # flash-attn-3 AND flash-attn-4 are pinned per CUDA group (cu128 vs cu130 / b5 vs b23) in
    # [dependency-groups] below. (fa4 b23 has the SM100 head_dim=256 kernel B300 needs; b5 does not.
    # fa4 is only auto-selected on Blackwell major>=10, so it's unused on cu12/Hopper regardless.)
    "liger-kernel==0.8.0; platform_system != 'Darwin'",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "mcp>=1.9.0",
    "openenv-core>=0.2.1",
    "docker>=7.0.0",
    "flash-linear-attention>=0.4.2",
    "causal-conv1d>=1.4.0; platform_system != 'Darwin'",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["open_instruct"]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]
flash-attn-3 = [{ requirement = "torch", match-runtime = true }]
# causal-conv1d builds a CUDA extension from source and its build-system requires
# an unpinned "torch"; without match-runtime, uv's build isolation pulls the current
# PyPI-default torch, which may mismatch the active CUDA group's runtime. Inject the
# project's runtime torch (cu128 for the cuda12 group, cu130 for cuda13) into its
# build, same as flash-attn.
causal-conv1d = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }
flash-attn-3 = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

# pytorch related setups
[tool.uv.sources]
ai2-olmo-core = { git = "https://github.com/allenai/OLMo-core.git", rev = "002958a8f15a" }
flash-attn = [
  { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3+cu128torch2.10-cp312-cp312-linux_x86_64.whl", group = "cuda12" },
  { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3+cu130torch2.10-cp312-cp312-linux_x86_64.whl", group = "cuda13" },
]

torch = [
  { index = "pytorch-cu128", group = "cuda12" },
  { index = "pytorch-cu130", group = "cuda13" },
  { index = "pytorch-cu130", marker = "platform_system == 'Linux' and platform_machine == 'aarch64'" },
]
torchvision = [
  { index = "pytorch-cu128", group = "cuda12" },
  { index = "pytorch-cu130", group = "cuda13" },
  { index = "pytorch-cu130", marker = "platform_system == 'Linux' and platform_machine == 'aarch64'" },
]
torchaudio = [
  { index = "pytorch-cu128", group = "cuda12" },
  { index = "pytorch-cu130", group = "cuda13" },
  { index = "pytorch-cu130", marker = "platform_system == 'Linux' and platform_machine == 'aarch64'" },
]

# vLLM wheels on PyPI are built against CUDA 12.8 on x86_64. The +cu130 builds
# are only published on the version-specific vLLM wheel index.
vllm = [
  { index = "vllm-cu130", group = "cuda13" },
]

[[tool.uv.index]]
name = "vllm-cu130"
url = "https://wheels.vllm.ai/0.19.1/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
code = [
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]
dr-tulu = [
    "dr_agent",
    "authlib",
    "scipy",
]

[tool.uv]
preview = true
python-preference = "only-managed"
link-mode = "hardlink"
default-groups = ["dev", "cuda12"]
conflicts = [
    [
        { group = "cuda12" },
        { group = "cuda13" },
    ],
]
override-dependencies = [
    "transformers>=5.4.0",
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin'",
]

[dependency-groups]
cuda12 = [
    "torch>=2.10.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "torchvision>=0.25.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "torchaudio>=2.10.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "vllm>=0.19.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "flash-attn>=2.8.3; platform_system == 'Linux' and platform_machine == 'x86_64'",
    # The flat FA3 index can publish a newer aarch64-only build than the latest x86_64 build.
    "flash-attn-3 @ https://github.com/windreamer/flash-attention3-wheels/releases/download/2026.03.19-850211f/flash_attn_3-3.0.0%2B20260318.cu128torch2100cxx11abitrue.8afc61-cp39-abi3-linux_x86_64.whl ; platform_system == 'Linux' and platform_machine == 'x86_64'",
    # cuda12 (Hopper): pin to EXACTLY omni_agent's source-of-truth versions — deepspeed 0.18.4
    # (pre-Ulysses-blocklist) + flash-attn-4 b5 (unused on Hopper; real backend is FA3). Zero drift.
    "deepspeed==0.18.4",
    "flash-attn-4 @ https://github.com/Dao-AILab/flash-attention/releases/download/fa4-v4.0.0.beta6/flash_attn_4-4.0.0b5-py3-none-any.whl ; platform_system != 'Darwin'",
]
cuda13 = [
    "torch>=2.10.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "torchvision>=0.25.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "torchaudio>=2.10.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "vllm>=0.19.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "flash-attn>=2.8.3; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "flash-attn-3 @ https://github.com/windreamer/flash-attention3-wheels/releases/download/2026.03.19-850211f/flash_attn_3-3.0.0%2B20260318.cu130torch2100cxx11abitrue.8afc61-cp39-abi3-linux_x86_64.whl ; platform_system == 'Linux' and platform_machine == 'x86_64'",
    # cuda13 (B300): deepspeed >=0.19.0 permits fa4 in Ulysses SP; flash-attn-4 b23 has the SM100 head_dim=256 kernel. See CUDA13_FA4_SP_PLAYBOOK.md.
    "deepspeed>=0.19.0",
    "flash-attn-4 @ https://github.com/Dao-AILab/flash-attention/releases/download/fa4-v4.0.0.beta23/flash_attn_4-4.0.0b23-py3-none-any.whl ; platform_system != 'Darwin'",
]
dev = [
    "beaker-py>=2.7.1",
    "mkdocs-material>=9.6.8",
    "pytest>=8.3.4",
    "ruff>=0.11.13",
    "ty>=0.0.1a13",
    "parameterized>=0.9.0",
    "rich>=13.7.0",
    "responses>=0.25.8",
    "pre-commit>=4.5.0",
]

[tool.pytest.ini_options]
addopts = "--ignore=oe-eval-internal/"
filterwarnings = [
    "ignore:.*sentry_sdk.Hub.*:DeprecationWarning",
    "ignore:builtin type SwigPy.*:DeprecationWarning",
]


[tool.black]
line-length = 119
target-version = ['py310']

[tool.ruff]
target-version = "py310"
line-length = 119
src = ["open_instruct"]
exclude = ["wandb"]

[tool.ruff.format]
# Use black-compatible formatting
quote-style = "double"
indent-style = "space"
line-ending = "auto"
# Preserve original parentheses style to minimize changes
skip-magic-trailing-comma = true
# Enable black-compatible string normalization
docstring-code-format = false

[tool.ruff.lint]
# Enable rules equivalent to previous autoflake and flake8 configs:
# F = Pyflakes (covers autoflake functionality)
# E = pycodestyle errors (flake8)
# W = pycodestyle warnings (flake8)
# I = isort
# SIM = flake8-simplify
# UP = pyupgrade
# B = flake8-bugbear
select = ["F", "E", "W", "I", "SIM", "UP", "B", "PLC0415"]
ignore = [
    "B905", # zip() without explicit strict= parameter
    "C408", # dict() calls (stylistic)
    "C901", # function complexity
    "E501", # Line too long (handled by line-length setting)
]

[tool.ruff.lint.isort]
known-first-party = ["open_instruct", "mason"]
# case insensitive to match isort --profile black
case-sensitive = false
# Disable split-on-trailing-comma to work with skip-magic-trailing-comma
split-on-trailing-comma = false

# Ignore unresolved imports because some packages (e.g. vllm) are not available on macOS
# Ignore possibly-missing-attribute for torch.distributed which has incomplete type stubs
[tool.ty.rules]
unresolved-import = "ignore"
possibly-missing-attribute = "ignore"

[tool.ty.src]
include = [
    "open_instruct/actor_manager.py",
    "open_instruct/benchmark_generators.py",
    "open_instruct/code_utils/api.py",
    "open_instruct/context_window_checker.py",
    "open_instruct/dataset_processor.py",
    "open_instruct/dataset_transformation.py",
    "open_instruct/data_loader.py",
    "open_instruct/data_types.py",
    "open_instruct/dpo_config.py",
    "open_instruct/dpo_utils.py",
    "open_instruct/grpo.py",
    "open_instruct/grpo_callbacks.py",
    "open_instruct/grpo_olmo_core_actor.py",
    "open_instruct/grpo_utils.py",
    "open_instruct/logger_utils.py",
    "open_instruct/mix_data.py",
    "open_instruct/mix_data_preferences.py",
    "open_instruct/olmo_core_train_modules.py",
    "open_instruct/padding_free_collator.py",
    "open_instruct/rejection_sampling/prompt_templates.py",
    "open_instruct/rl_utils.py",
    "open_instruct/distillkit/compression/bitpack.py",
    "open_instruct/distillkit/compression/compressor.py",
    "open_instruct/distillkit/compression/config.py",
    "open_instruct/distillkit/compression/monotonic_logprobs.py",
    "open_instruct/distillkit/sample_common.py",
    "open_instruct/rubrics/evolving_rubric_step.py",
    "open_instruct/rubrics/metrics.py",
    "open_instruct/rubrics/prompts.py",
    "open_instruct/rubrics/rubric_utils.py",
    "open_instruct/rubrics/run_utils.py",
    "open_instruct/environments/base.py",
    "open_instruct/environments/examples.py",
    "open_instruct/environments/tools/generic_mcp.py",
    "open_instruct/environments/tools/parsers.py",
    "open_instruct/environments/tools/tools.py",
    "open_instruct/environments/tools/utils.py",
]
exclude = ["scripts/", "decontamination/", "human_eval/"]
