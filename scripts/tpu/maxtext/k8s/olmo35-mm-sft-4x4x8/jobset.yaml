# Olmo 3.5 tiny multimodal SFT (MaxText pre_train trainer, olmo_mm data) on one reserved 4x4x8 v4 slice (128 chips,
# 32 hosts) of gke-tpu-v4, post-training queue. From allenai/olmo-gcp-infra@3575547e82325258583ff7f83e3e7e123d1e7826
# examples/olmo35-maxtext/k8s/mm-sft-4x4x8/jobset.yaml (the reference run's overlay), renamed to olmo35-mm-sft so it
# never shares ConfigMaps with the text SFT overlays. Its own launcher (train_mm_sft.sh): the multimodal recipe runs
# MaxText's pre_train trainer with OLMo-core's data loader in-process, not train_sft.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: olmo35-mm-sft
  namespace: olmo
  labels:
    kueue.x-k8s.io/queue-name: post-training
  annotations:
    # Each replicated job (one per slice) gets a node pool, i.e. a slice, to itself.
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  ttlSecondsAfterFinished: 86400
  failurePolicy:
    # No restarts on a first launch: a failure should stop the run so it can be read, not replay it (a restart also
    # re-reads every past batch, since the olmo_mm loader has no saved state). Raise it once a run is known healthy.
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    replicas: 1 # Slices. More than one is a JAX multislice job.
    template:
      spec:
        parallelism: 32 # Hosts per slice.
        completions: 32
        backoffLimit: 0 # Multi-host TPU jobs are all-or-nothing; JobSet restarts the whole set.
        template:
          metadata:
            annotations:
              # GKE's gcsfuse CSI driver adds a sidecar that mounts the data buckets. "0" lifts its resource
              # limits; the TPU hosts have CPU and memory to spare.
              gke-gcsfuse/volumes: "true"
              gke-gcsfuse/cpu-limit: "0"
              gke-gcsfuse/memory-limit: "0"
              gke-gcsfuse/ephemeral-storage-limit: "0"
          spec:
            # The image's libtpu only forms a multi-host slice on the host network. A hostNetwork pod acts as the
            # node's service account for MaxText's own GCS calls (checkpoints, host logs); the gcsfuse mounts still
            # authenticate as this service account (hostNetworkPodKSA below).
            serviceAccountName: olmo
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet # Resolve the JobSet's pod hostnames from the host network.
            # Never restart a container in place: a failed host fails the Job, and JobSet restarts every slice.
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu-v4-podslice
              cloud.google.com/gke-tpu-topology: 4x4x8
            containers:
            - name: maxtext
              image: us-docker.pkg.dev/ai2-olmo/olmo/maxtext # tag pinned by kustomization.yaml images:; apply with kubectl apply -k, not -f
              command: [bash, /launcher/train_mm_sft.sh]
              envFrom:
              - configMapRef:
                  name: olmo35-mm-sft-env
              env:
              # Only needed if a Hugging Face download gets rate limited (the recipe runs with HF_HUB_OFFLINE=1).
              # kubectl -n olmo create secret generic hf-token --from-literal=token=hf_...
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-token
                    key: token
                    optional: true
              ports:
              - containerPort: 8471 # TPU runtime.
              - containerPort: 8080 # MXLA coordinator.
              - containerPort: 8431 # TPU metrics.
              volumeMounts:
              - name: launcher
                mountPath: /launcher
                readOnly: true
              # The OLMo-core loader's worker threads share tensors through /dev/shm.
              - name: dshm
                mountPath: /dev/shm
              # Only the data subfolders of gs://midtraining-data/weka (the Weka mirror) the recipe reads, each at its
              # /weka path so the paths in the OLMo-core data config resolve unchanged. No checkpoint folders:
              # checkpoints go over gs:// directly.
              - name: weka-c12-cache # C12 numpy SFT cache (text)
                mountPath: /weka/oe-training-default/ai2-llm/checkpoints/abhishekr/c12/a7/cache-neptune/numpy_sft/bf82a8fab8-6068a350-rowaligned
                readOnly: true
              - name: weka-replay # long-context replay numpy dir (text); data only, no checkpoints
                mountPath: /weka/olmo-3p5-post-checkpoints/abhishekr/h182/replay-b1c12r
                readOnly: true
              - name: weka-mm-olmo # MOLMO_DATA_DIR: the image corpora of mixture stage2_v1
                mountPath: /weka/oe-training-default/mm-olmo
                readOnly: true
              - name: weka-hf-cache # HF hub cache (the dolma2-tokenizer-olmo35 snapshot); hub/ is HF_HUB_CACHE
                mountPath: /weka/oe-training-default/ai2-llm/checkpoints/abhishekr/c11/hf_cache
                readOnly: true
              resources:
                limits:
                  google.com/tpu: 4 # All chips on the host; every TPU container must take the whole host.
            volumes:
            - name: launcher
              configMap:
                name: olmo35-mm-sft-launcher
            - name: dshm
              emptyDir:
                medium: Memory
            # Read-only, metadata cached forever, and no metadata prefetch on mount: mm-olmo holds millions of
            # objects. The text loader globs token_ids_part_*.npy, so implicit-dirs is required.
            - name: weka-c12-cache
              csi:
                driver: gcsfuse.csi.storage.gke.io
                readOnly: true
                volumeAttributes:
                  bucketName: midtraining-data
                  mountOptions: only-dir=weka/oe-training-default/ai2-llm/checkpoints/abhishekr/c12/a7/cache-neptune/numpy_sft/bf82a8fab8-6068a350-rowaligned,implicit-dirs,metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:-1,metadata-cache:type-cache-max-size-mb:-1,file-system:kernel-list-cache-ttl-secs:-1
                  hostNetworkPodKSA: "true" # Authenticate the mount as serviceAccountName despite hostNetwork.
            - name: weka-replay
              csi:
                driver: gcsfuse.csi.storage.gke.io
                readOnly: true
                volumeAttributes:
                  bucketName: midtraining-data
                  mountOptions: only-dir=weka/olmo-3p5-post-checkpoints/abhishekr/h182/replay-b1c12r,implicit-dirs,metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:-1,metadata-cache:type-cache-max-size-mb:-1,file-system:kernel-list-cache-ttl-secs:-1
                  hostNetworkPodKSA: "true"
            - name: weka-mm-olmo
              csi:
                driver: gcsfuse.csi.storage.gke.io
                readOnly: true
                volumeAttributes:
                  bucketName: midtraining-data
                  mountOptions: only-dir=weka/oe-training-default/mm-olmo,implicit-dirs,metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:-1,metadata-cache:type-cache-max-size-mb:-1,file-system:kernel-list-cache-ttl-secs:-1
                  hostNetworkPodKSA: "true"
            - name: weka-hf-cache
              csi:
                driver: gcsfuse.csi.storage.gke.io
                readOnly: true
                volumeAttributes:
                  bucketName: midtraining-data
                  mountOptions: only-dir=weka/oe-training-default/ai2-llm/checkpoints/abhishekr/c11/hf_cache,implicit-dirs,metadata-cache:ttl-secs:-1,metadata-cache:stat-cache-max-size-mb:-1,metadata-cache:type-cache-max-size-mb:-1,file-system:kernel-list-cache-ttl-secs:-1
                  hostNetworkPodKSA: "true"
