# H131 (ledger, if-dose-c11-7b): H122's overlay (../h122/olmo3-7b-c11-s0) with only names, TRAIN_FILES and the run
# name changed; data from the ledger's experiments/h131/p1 (c11if: C11 + 4 copies of H123's IF build; c11: C11).
# H122 (ledger): H089's Olmo 3 7B recipe on one 4x4x8 with the data swapped for C11 (allenai/olmo35-sft-c11-mix@2d5d40e,
# no replay), pre-rendered for this loader by the ledger's experiments/h122/p1/prerender.py (tools folded into the system
# message, tool calls in their template form) and expanded by C11's mixer weights (2,984,098 rows). Differs from
# ../../h089/olmo3-7b-s0 only in names, TRAIN_FILES and steps: 16,304 = C11's step count (17.10B token slots); warmup 3%
# of it from step one, then linear to 0. Everything else (base, tokenizer, template, prefix labels, LR, mesh, image) is H089's.
#   kubectl --context gke_ai2-olmo_us-central2-b_gke-tpu-v4 apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: olmo

resources:
- jobset.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: h131-olmo3-7b-c11if-s1-launcher
  files:
  - train_sft.sh # a copy of ../../olmo3-sft/train_sft.sh (kustomize loads no files from outside this directory); keep them identical
- name: h131-olmo3-7b-c11if-s1-env
  literals:
  # Set a unique name before launching; do not resume or overwrite the reference run.
  - RUN_NAME=olmo3-7b-sft-h131-c11if-s1
  - OUTPUT_DIR=gs://ai2-olmo-dev/post-training/runs
  # allenai/Olmo-3-1025-7B converted 2026-10-07 with MaxText's to_maxtext (model_name=olmo3-7b, bf16, as the HF weights);
  # its safetensors (sha256 0490d666, e127ea47, f3ddff10) are unchanged from 7941e113 through a81bae42. 4K loss parity passed on it (#1933).
  - LOAD_PARAMETERS_PATH=gs://ai2-olmo-dev/post-training/checkpoints/olmo3-1025-7b/0/items
  - TOKENIZER_PATH=/mnt/post-training/tokenizers/olmo35-8b971706-h045
  - TRAIN_FILES=/mnt/post-training/data/h131/c11if-r4-s1/*.parquet
  - MODEL_NAME=olmo3-7b
  - MAXTEXT_SFT_LABELS=prefix
  - TOTAL_DEVICES=128
  - GLOBAL_BATCH=16
  - PER_DEVICE_BATCH=0.125
  - SEQ_LEN=65536
  - LR=5e-5
  - WARMUP_FRAC=0.03
  - LR_SCHEDULE_STEPS=16304
  - STEPS=16304
  - NUM_EPOCH=2
  - DATA_SEED=0
  # FSDP 16 x tensor 8: batch shards over fsdp (16 sequences, A0''s data layout), one 64K sequence over 8 chips.
  # remat_policy=minimal (A0' uses full): 8.85 s/step vs 10.12 with full, the same batches (H089 P5, Amendment 1).
  # The vocabulary (100,278) does not divide by 8, so the vocab axis is replicated across the tensor group (zero-padding
  # it costs +3.2 nats/token; see README Traps).
  - EXTRA_ARGS=logical_axis_rules=[['vocab',[]],['activation_vocab',[]]] sharding_tolerance=0.05 warmup_step_offset=1 z_loss_multiplier=1e-5 enable_checkpointing=true checkpoint_period=300 max_num_checkpoints_to_keep=2 ici_fsdp_parallelism=16 ici_tensor_parallelism=8 num_vocab_tiling=16 remat_policy=minimal attention=flash sa_block_q=512 sa_block_kv=512 sa_block_kv_compute=512 sa_block_q_dkv=512 sa_block_kv_dkv=512 sa_block_kv_dkv_compute=512
  - LIBTPU_INIT_ARGS=--xla_enable_async_all_gather=true --xla_tpu_scoped_vmem_limit_kib=16384
  - TPU_MEGACORE=MEGACORE_DENSE
  - MAXTEXT_LOG_BATCH_HASH=1 # per-step batch hashes in the log, to check a resume against A0''s batches

images:
- name: us-docker.pkg.dev/ai2-olmo/olmo/maxtext-posttrain
  newTag: 51f8cc4b-p907d86f3-rfb46e215e
