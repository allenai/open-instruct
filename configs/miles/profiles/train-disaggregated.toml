# Default full-SFT training starter: two Core trainer B300s + one TP1 serving B300.
# Copy and replace /data paths. See configs/miles/README.md for preparation,
# bounded async, adding engines, and the distinction between tested and candidate sizes.
# 100 updates, 8 prompts x 8 responses, admission 64 rather than 4.
# Admission/pools passed the 12-update sync/async B300 trial; the complete
# 100-update eval/save recipe remains a starter, not a completed run.
[core]
row_specialization = "dynamic"
expert_parallel_size = 2
attention_backend = "flash_4"
max_sequence_length = 6144
activation_checkpointing = true
max_policy_lag = 0
max_train_rollout_logprob_abs_diff = 0.05
diagnostic_interval = 0
router_aux_loss_weight = 0.01
router_z_loss_weight = 0.00001
stream_moe_export = true
weight_sync_mode = "flattened"
reward_config = "/data/verifiers.json"

[miles]
hf_checkpoint = "/data/hf"
prompt_data = "/data/train.jsonl"
input_key = "input"
label_key = "label"
metadata_key = "metadata"
custom_rm_path = "open_instruct.miles.rewards.registered_reward"
actor_num_nodes = 1
actor_num_gpus_per_node = 2
num_gpus_per_node = 3
rollout_num_gpus = 1
rollout_num_gpus_per_engine = 1
colocate = false
fully_async = false
offload_train = false
offload_rollout = false
micro_batch_size = 1
rollout_batch_size = 8
n_samples_per_prompt = 8
global_batch_size = 64
num_rollout = 100
rollout_temperature = 1.0
rollout_seed = 17
rollout_max_prompt_len = 2048
rollout_max_response_len = 4096
rollout_max_context_len = 6144
eval_prompt_data = ["heldout", "/data/eval.jsonl"]
eval_interval = 20
eval_temperature = 0.0
n_samples_per_eval_prompt = 1
eval_max_response_len = 4096
sglang_context_length = 6144
# 64 x 6144 = 393216 worst-case tokens, plus pool headroom. Radix stays off.
sglang_max_total_tokens = 524288
sglang_max_running_requests = 64
sglang_server_concurrency = 64
sglang_mem_fraction_static = 0.6
sglang_disable_radix_cache = true
sglang_max_mamba_cache_size = 128
sglang_cuda_graph_backend_decode = "full"
sglang_cuda_graph_max_bs_decode = 64
sglang_cuda_graph_backend_prefill = "disabled"
sglang_sampling_backend = "pytorch"
sglang_attention_backend = "triton"
sglang_log_level = "info"
check_weight_update_equal = true
update_weight_buffer_size = 1073741824
update_weights_interval = 1
loss_type = "policy_loss"
advantage_estimator = "grpo"
# Match the established full-SFT GSM8K objective. Serving capacity is independent.
use_rollout_logprobs = false
disable_grpo_std_normalization = true
eps_clip = 0.2
eps_clip_high = 0.28
kl_loss_coef = 0.0
entropy_coef = 0.0
weight_decay = 0.0
adam_beta1 = 0.9
adam_beta2 = 0.95
adam_eps = 0.00000001
clip_grad = 1.0
lr_decay_style = "constant"
lr_warmup_iters = 0
lr = 0.000001
lr_decay_iters = 100
seed = 17
save = "/data/checkpoints"
# Native saves are synchronous; measured full-SFT checkpoint size is about 222 GB.
# Save at the final update initially; choose a recovery cadence for longer runs.
save_interval = 100
save_debug_rollout_data = "/data/rollouts/{rollout_id}.pt"

# Offline files are retained without credentials. Set mode/team for online W&B.
use_wandb = true
wandb_mode = "offline"
wandb_project = "olmo-rl-comparison"
wandb_group = "core-disaggregated"
wandb_dir = "/data/wandb"
wandb_always_use_train_step = true
