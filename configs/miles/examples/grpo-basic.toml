# Tiny-model colocated development check: one shared GPU; Core stays resident.
# Replace YOUR_USERNAME/model source before launch; inspect `plan` first.
schema_version = 1
name = "grpo-basic"

[model]
source = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/tiny-policy-hf"
format = "hf"

[output]
root = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/runs/grpo-basic"
export_hf = true

[launch]
workspace = "ai2/open-instruct-dev"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "urgent"
min_runtime = "1h"
timeout = "2h"
auto_resume = true
gpus_per_replica = 1

[[launch.weka_mounts]]
weka = "oe-training-default"
mount_path = "/weka/oe-training-default"

[data]
seed = 17
shuffle = true

# Compact generated prompts keep this a local plumbing check, not an accuracy run.
[[data.tasks]]
task = "multiplication"
train_count = 32
eval_count = 8

[training]
num_rollouts = 2
skip_eval_before_train = false
eval_interval = 2
save_checkpoints = true
# Core saves synchronously. Choose a more frequent cadence for recovery.
save_interval = 2

[trainer]
gpus = 1
trainer_num_nodes = 1
expert_parallel_size = 1
micro_batch_size = 1
activation_recompute = true

[inference]
placement_mode = "colocated"
gpus = 1
rollout_tensor_parallel_size = 1
# Restore the historical 8 prompts x 8 responses, one optimizer update/collection.
rollout_batch_size = 8
samples_per_prompt = 8
global_batch_size = 64
max_response_length = 256
max_context_length = 512
sglang_server_concurrency = 64
sglang_max_running_requests = 64
sglang_max_total_tokens = 32768
sglang_max_mamba_cache_size = 128
sglang_mem_fraction_static = 0.2
radix_cache = false
sglang_cuda_graph_backend_decode = "disabled"
sglang_cuda_graph_max_bs_decode = 64
sglang_cuda_graph_backend_prefill = "disabled"
sglang_sampling_backend = "pytorch"
sglang_attention_backend = "torch_native"
check_weight_update_equal = true
update_weight_buffer_size = 1073741824

[optimizer]
learning_rate = 0.000001
lr_decay_style = "constant"
lr_warmup_iters = 0
weight_decay = 0.0
adam_beta1 = 0.9
adam_beta2 = 0.95
adam_eps = 0.00000001
clip_grad = 1.0
kl_loss_coef = 0.0
entropy_coef = 0.0
eps_clip = 0.2
eps_clip_high = 0.28

[tracking]
wandb_mode = "offline"
wandb_project = "olmo-rl-comparison"
wandb_group = "core-workflow-basic"

[runtime]
row_specialization = "dynamic"

[core]
attention_backend = "torch"
max_train_rollout_logprob_abs_diff = 0.05
router_aux_loss_weight = 0.01
router_z_loss_weight = 0.00001
stream_moe_export = true
weight_sync_mode = "flattened"

[miles]
rollout_temperature = 1.0
rollout_seed = 17
rollout_max_prompt_len = 256
seed = 17
disable_grpo_std_normalization = true

# Persistent Triton caches shared by every user of this runtime image; the
# fingerprint keys on image, sources, model and run shape, so a mismatch is a
# cold miss rather than a wrong hit. Omit shared_root to use this default.
[compiler_cache]
enabled = true
shared_root = "/weka/oe-training-default/open-instruct-compiler-cache/tmp-7d"
restore = true
