# Qualification candidate, NOT a validated full-model async operating default.
# First establish synchronous correctness using sft-b300-ep2-sync.toml.
# Three B300 GPUs, resident engines, one optimizer update per collection.
# Eager decode isolates async lifecycle from graph/replay changes. No replay.
# Four updates, no optimizer checkpoints; restart needs a separate qualification.
[core]
row_specialization = "dynamic"
expert_parallel_size = 2
attention_backend = "flash_4"
max_sequence_length = 2560
activation_checkpointing = true
max_policy_lag = 1
max_train_rollout_logprob_abs_diff = 0.05
diagnostic_interval = 1
router_aux_loss_weight = 0.01
router_z_loss_weight = 0.00001
stream_moe_export = true
# Qualified 2026-09-12 on the full 512-expert model: stacked per-layer experts cut
# publication from 2.6 s to 0.35 s with 2 GiB buckets; HF exports stay per-expert.
expert_publication = "fused"
weight_sync_mode = "flattened"
reward_config = "/data/verifiers.json"

[miles]
hf_checkpoint = "/data/hf"
prompt_data = "/data/train.jsonl"
input_key = "input"
label_key = "label"
metadata_key = "metadata"
custom_rm_path = "open_instruct.miles.rewards.registered_reward"
actor_num_nodes = 1
actor_num_gpus_per_node = 2
num_gpus_per_node = 3
rollout_num_gpus = 1
rollout_num_gpus_per_engine = 1
offload_rollout = false
micro_batch_size = 1
fully_async = true
async_data_buffer_capacity_factor = 2.0
async_unused_samples_handler = "retry"
rollout_submission_granularity = "group"
use_rollout_logprobs = false
use_tis = true
rollout_batch_size = 8
n_samples_per_prompt = 8
global_batch_size = 64
num_rollout = 4
rollout_temperature = 1.0
rollout_seed = 17
rollout_max_prompt_len = 2048
rollout_max_response_len = 512
rollout_max_context_len = 2560
sglang_context_length = 2560
# Admit the complete 64-response collection; 64 x 2560 = 163840 tokens.
sglang_max_total_tokens = 262144
sglang_max_running_requests = 64
sglang_server_concurrency = 64
sglang_mem_fraction_static = 0.6
sglang_disable_radix_cache = true
sglang_max_mamba_cache_size = 128
sglang_cuda_graph_backend_decode = "disabled"
sglang_cuda_graph_backend_prefill = "disabled"
sglang_sampling_backend = "pytorch"
sglang_log_level = "info"
check_weight_update_equal = true
update_weight_buffer_size = 2147483648
update_weights_interval = 1
loss_type = "policy_loss"
advantage_estimator = "grpo"
lr = 0.000001
lr_decay_iters = 4
seed = 17
save = "/data/metrics"
save_debug_rollout_data = "/data/rollouts/{rollout_id}.pt"
