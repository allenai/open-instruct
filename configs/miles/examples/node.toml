# Single B300 node: 2 trainer GPUs (EP2), 6 inference engines; no judge.
# Before setting up a run, review configuration options and defaults:
# https://allenai.github.io/open-instruct/miles/configuration/
# Setup and workload requirements: configs/miles/examples/README.md
# Replace YOUR_USERNAME and input paths; inspect `plan` before launching.
schema_version = 1
name = "node"

[model]
source = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/checkpoints/policy-hf"

[output]
root = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/runs/node"
export_hf = true

[launch]
workspace = "ai2/open-instruct-dev"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "high"
min_runtime = "4h"
timeout = "48h"
auto_resume = true
gpus_per_replica = 8

[[launch.weka_mounts]]
weka = "oe-training-default"
mount_path = "/weka/oe-training-default"

[launch.env]
OI_MILES_RAY_CPUS = "64"
OI_MILES_MATH_TIMEOUT_POLICY = "zero"
OI_MILES_CODE_FAILURE_POLICY = "zero"
SGLANG_TIMEOUT_KEEP_ALIVE = "60"
NCCL_SOCKET_IFNAME = "ib"
NCCL_IB_HCA = "^=mlx5_bond_0"

[launch.secrets]
BEAKER_TOKEN = "YOUR_USERNAME_BEAKER_TOKEN"

# Prepared math, instruction-following and code data; no judge-dependent verifiers.
[data]
prompt_data = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/data/math-ifeval-code/train.jsonl"
reward_config = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/data/math-ifeval-code/verifiers.json"

[training]
num_rollouts = 200
save_interval = 25

[evaluation]
mode = "background"
interval = 50
initial = true
final = true
# Evaluator image with the inline olmo-eval SGLang provider.
image = "01M5ZGD5K01GNW3ASDPNXXPEJ3"
revision = "3536fe751e40162cc33d5e647085e986375aadce"
gpus = 1 # Additional allocation per task group, outside the 8-GPU training layout.
cluster = "ai2/holmes"
submit_timeout = 30
timeout = "3h"
# Select the qualified H100/B300 settings on the evaluator GPU; fail if unsupported.
# Automatic harness batches use the engine's sequence capacity, including pass@k expansion.
provider_kwargs = { profile = "olmo3.5-12.5b", context_length = 34816 }

[[evaluation.tasks]]
task = "gsm8k"
# Independent 8K evaluation budget; training still uses 32K responses.
# Clear GSM8K's default blank-line stop so it does not truncate reasoning there.
generation = { temperature = 0.0, max_tokens = 8192, num_samples = 1, stop_sequences = [] }
scoring = { limit = 128, num_fewshot = 0 }

[[evaluation.tasks]]
task = "gsm8k:platinum"
generation = { temperature = 0.0, max_tokens = 8192, num_samples = 1, stop_sequences = [] }
scoring = { limit = 128, num_fewshot = 0 }

[[evaluation.tasks]]
task = "ifeval_ood" # IFBench; distinct from IFEval.
generation = { temperature = 0.0, max_tokens = 8192, num_samples = 1, stop_sequences = [] }
scoring = { limit = 128 }

[trainer]
gpus = 2
expert_parallel_size = 2
sequence_packing = true
packing_max_tokens = 34816

[inference]
placement_mode = "disaggregated"
gpus = 6
rollout_batch_size = 128
samples_per_prompt = 8
global_batch_size = 1024
max_response_length = 32768
max_context_length = 34816
# Pin the measured B300 preset; incompatible model/hardware/topology fails loudly.
# Presets apply whole. To tune their settings, select generic and copy the preset block.
profile = "olmo35-b300-v1"

[tracking]
wandb_mode = "offline"
wandb_team = "ai2-llm"
wandb_project = "open-instruct-miles"
wandb_group = "node"

[core]
max_policy_lag = 12
# A response cut off at max_response_length scores 0 (capped = wrong).
reward_zero_truncated = true
checkpoint_keep_last = 2
publication_mode = "refresh"
engine_drain_timeout = 900.0
pipeline_observation_interval = 2.0
router_aux_loss_weight = 0.0
router_z_loss_weight = 0.0
scoring_check_interval = 0

[miles]
# HTTP workers decode replies before handing them to the producer.
use_distributed_post = true
http_post_actors_per_node = 16
http_post_num_cpus = 1.0
rollout_executor_num_cpus = 2.0
# Keep response weighting independent of generation length.
calculate_per_token_loss = false
# Trainer ranks only; do not change the serving allocator.
train_env_vars = { PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True" }
sglang_enable_metrics = true
use_rollout_routing_replay = true

[async]
fully_async = true
# Bound unfinished samples independently of the six engines' reserved capacity.
# Compare trainer wait and stale-work discards before increasing this budget.
async_max_concurrent_samples = 1024

[compiler_cache]
shared_root = "/weka/oe-training-default/open-instruct-compiler-cache/tmp-7d"
