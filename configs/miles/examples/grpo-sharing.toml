# MILES GRPO first run: 2 trainer + 2 inference B300 GPUs, two updates.
# Derived from small.toml's 24-update-qualified training settings; this short
# workflow includes initial/final evaluation and is not a throughput benchmark.
# Copy into Git-ignored runs/my-grpo.toml; edit name and output.root.
# Use: export MILES_EXISTING_IMAGE=01M2F1RKZFZVJYAS0XQGEC3SEJ
# Mixed-policy refresh, lag two and 32 prompts x 4 responses are deliberate.
# Longer runs: copy small.toml and choose evaluation/checkpoint cadence.
schema_version = 1
name = "YOUR_USERNAME-grpo-smoke"

# Existing qualified checkpoint: owner path is intentional; keep it read-only.
[model]
source = "/weka/oe-training-default/robertb/olmo-miles/checkpoints/olmoe3-kda-1.2b-dolci-think-sft-65536-router-bf16-autocast-v2-hf"
format = "hf"

# Replace YOUR_USERNAME and use a fresh path for each independent run.
# Saves/final export are off in this short check.
[output]
root = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/runs/grpo-smoke"
export_hf = false

[launch]
workspace = "ai2/open-instruct-dev"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "urgent"
min_runtime = "1h"
timeout = "3h"
auto_resume = false
gpus_per_replica = 4

[[launch.weka_mounts]]
weka = "oe-training-default"
mount_path = "/weka/oe-training-default"

[data]
seed = 17
shuffle = true

[[data.tasks]]
task = "gsm8k"
train_count = 64
eval_count = 8

[training]
num_rollouts = 2
skip_eval_before_train = false
eval_interval = 2
save_checkpoints = false

[trainer]
gpus = 2
trainer_num_nodes = 1
expert_parallel_size = 2
micro_batch_size = 1
sequence_packing = true
packing_max_tokens = 6144
activation_recompute = false
trainer_flash_attention_version = 4

[inference]
placement_mode = "disaggregated"
gpus = 2
rollout_tensor_parallel_size = 1
rollout_batch_size = 32
samples_per_prompt = 4
global_batch_size = 128
max_response_length = 4096
max_context_length = 6144
sglang_server_concurrency = 32
sglang_max_running_requests = 32
sglang_max_total_tokens = 786432
sglang_max_mamba_cache_size = 1024
sglang_mem_fraction_static = 0.6
radix_cache = true
mamba_radix_cache_strategy = "extra_buffer"
sglang_cuda_graph_backend_decode = "full"
sglang_cuda_graph_max_bs_decode = 32
sglang_cuda_graph_backend_prefill = "disabled"
sglang_sampling_backend = "pytorch"
sglang_attention_backend = "triton"
check_weight_update_equal = true
update_weight_buffer_size = 1073741824

[optimizer]
learning_rate = 0.000001
lr_decay_style = "constant"
lr_warmup_iters = 0
weight_decay = 0.0
adam_beta1 = 0.9
adam_beta2 = 0.95
adam_eps = 0.00000001
clip_grad = 1.0
kl_loss_coef = 0.0
entropy_coef = 0.0
eps_clip = 0.2
eps_clip_high = 0.28

[tracking]
# Offline keeps W&B metrics without a WANDB_API_KEY. Use "disabled" to turn it off.
# For "online", select your project/group and add the secret-name mapping below.
wandb_mode = "offline"
wandb_project = "olmo-rl-comparison"
wandb_group = "core-grpo-smoke"

[runtime]
row_specialization = "dynamic"

[core]
# Async score differences include policy age; establish a workload-specific gate if needed.
publication_mode = "refresh"
refresh_request_timeout = 1800.0
engine_drain_timeout = 900.0
scoring_pass_required = false
pipeline_observation_interval = 2.0
replay_diagnostics = false # Qualification enabled this extra audit.
router_aux_loss_weight = 0.01
router_z_loss_weight = 0.00001
stream_moe_export = true
weight_sync_mode = "flattened"
expert_publication = "per_expert"
scoring_check_interval = 50

[miles]
sglang_enable_metrics = true
use_rollout_routing_replay = true
use_miles_router = true
sglang_chunked_prefill_size = 8192
rollout_temperature = 1.0
rollout_seed = 17
rollout_max_prompt_len = 2048
seed = 17
disable_grpo_std_normalization = true

[async]
fully_async = true
async_max_concurrent_samples = 512
max_weight_staleness = 2
async_data_buffer_capacity_factor = 1.0
async_unused_samples_handler = "retry"
rollout_submission_granularity = "group"
off_policy_correction = "tis"

[compiler_cache]
enabled = true
shared_root = "/weka/oe-training-default/open-instruct-compiler-cache/tmp-7d"
restore = true

# Optional credentials: leave commented for the supplied starter inputs.
# Beaker login and workspace/image/budget/WEKA access are still required.
# These values are Beaker secret NAMES, never literal token values.
# The prebuilt runtime needs no GITHUB_TOKEN to fetch its source.
# [launch.secrets]
# HF_TOKEN = "YOUR_USERNAME_HF_TOKEN"           # Only for restricted downloads.
# WANDB_API_KEY = "YOUR_USERNAME_WANDB_API_KEY" # Only for online tracking.
