# Stdio learning-path qualification on short natural problems; not a production recipe.
# Original targets/template; longer response budget allows answers to finish.
schema_version = 1
name = "colleague-10-stdio-20260913-r2"

[model]
source = "/weka/oe-training-default/robertb/olmo-miles/checkpoints/olmoe3-kda-1.2b-dolci-think-sft-65536-router-bf16-autocast-v2-hf"
format = "hf"

[output]
root = "/weka/oe-training-default/robertb/open-instruct/runs/colleague-10-stdio-20260913-r2"
export_hf = false

[launch]
workspace = "ai2/open-instruct-dev"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "urgent"
min_runtime = "1h"
timeout = "2h"
auto_resume = false
gpus_per_replica = 3

[[launch.weka_mounts]]
weka = "oe-training-default"
mount_path = "/weka/oe-training-default"

[[launch.weka_mounts]]
weka = "oe-adapt-default"
mount_path = "/weka/oe-adapt-default"


[data]
prompt_data = "/weka/oe-training-default/robertb/open-instruct/data/colleague-stdio-20260913-r2/train.jsonl"
eval_prompt_data = ["mixed", "/weka/oe-training-default/robertb/open-instruct/data/colleague-stdio-20260913-r2/eval.jsonl"]
reward_config = "/weka/oe-training-default/robertb/open-instruct/data/colleague-stdio-20260913-r2/verifiers.json"
shuffle = false

[training]
num_rollouts = 2
skip_eval_before_train = true
save_checkpoints = false

[trainer]
gpus = 2
trainer_num_nodes = 1
expert_parallel_size = 2
micro_batch_size = 1
sequence_packing = true
packing_max_tokens = 8192
activation_recompute = true
trainer_flash_attention_version = 4

[inference]
placement_mode = "disaggregated"
gpus = 1
rollout_tensor_parallel_size = 1
rollout_batch_size = 4
samples_per_prompt = 4
global_batch_size = 16
max_response_length = 6144
max_context_length = 8192
sglang_server_concurrency = 16
sglang_max_running_requests = 16
sglang_max_total_tokens = 524288
sglang_max_mamba_cache_size = 192
sglang_mem_fraction_static = 0.6
radix_cache = true
sglang_mamba_radix_cache_strategy = "extra_buffer"
sglang_router_policy = "cache_aware"
sglang_cuda_graph_backend_decode = "full"
sglang_cuda_graph_max_bs_decode = 64
sglang_cuda_graph_backend_prefill = "disabled"
sglang_sampling_backend = "pytorch"
sglang_attention_backend = "triton"
check_weight_update_equal = true
update_weight_buffer_size = 2147483648

[optimizer]
learning_rate = 0.000001
lr_decay_style = "constant"
lr_warmup_iters = 0
weight_decay = 0.0
adam_beta1 = 0.9
adam_beta2 = 0.95
adam_eps = 0.00000001
clip_grad = 1.0
kl_loss_coef = 0.0
entropy_coef = 0.0
eps_clip = 0.2
eps_clip_high = 0.28

[tracking]
wandb_mode = "offline"
wandb_project = "olmo-rl-comparison"
wandb_group = "colleague-stdio-20260913"
wandb_team = "ai2-llm"

[runtime]
row_specialization = "dynamic"

[core]
diagnostic_interval = 0
replay_diagnostics = true
max_train_rollout_logprob_abs_diff = 0.05
router_aux_loss_weight = 0.01
router_z_loss_weight = 0.00001
stream_moe_export = true
weight_sync_mode = "flattened"
expert_publication = "fused"
scoring_check_interval = 20

[miles]
use_rollout_routing_replay = true
use_miles_router = true
rollout_temperature = 1.0
rollout_seed = 17
rollout_max_prompt_len = 2048
seed = 17
disable_grpo_std_normalization = true

[compiler_cache]
enabled = true
shared_root = "/weka/oe-training-default/open-instruct-compiler-cache/tmp-7d"
restore = true
