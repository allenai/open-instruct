# Pre-run gate for ../olmo35-small-mm-sft-4x4x8-noimg (the text-only arm), as ../olmo35-small-mm-sft-8x8x8-gate:
# 20 steps with every document routing over all 256 experts, no checkpoint; step-1 CE against the reference forward
# of file 1's 16 rows, the SMALLMM-ROWS lines against the text stream's TRAINED-ROW-HASHES, memory, REQUIRED_RBF and
# MOE-DROPPED at factor 4.5.
#   kubectl kustomize . | less
#   kubectl --context gke_ai2-olmo_us-central2-b_gke-tpu-v4 apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../olmo35-small-mm-sft-4x4x8-noimg
nameSuffix: -gate
configMapGenerator:
- name: olmo35-small-mm-sft-env
  behavior: merge
  literals:
  - RUN_NAME=CHANGE_ME
  - STEPS=20
  - CHECKPOINT_PERIOD=1000000
  - TRAIN_ARGS=learning_rate_schedule_steps=8076 warmup_steps_fraction=0.02996532937097573 wsd_decay_steps_fraction=0.9700346706290243 emo_document_expert_pool_choices=[256] emo_document_expert_pool_probs=[1.0]
  - EXTRA_ARGS=log_period=1 jax_cache_dir=gs://ai2-olmo-dev/post-training/jax_cache enable_single_replica_ckpt_restoring=true save_checkpoint_on_completion=false
patches:
- target:
    kind: JobSet
    name: olmo35-small-mm-sft
  patch: |
    - op: replace
      path: /spec/replicatedJobs/0/template/spec/template/spec/containers/0/envFrom/0/configMapRef/name
      value: olmo35-small-mm-sft-env-noimg-gate
    - op: replace
      path: /spec/replicatedJobs/0/template/spec/template/spec/volumes/0/configMap/name
      value: olmo35-small-mm-sft-launcher-noimg-gate
