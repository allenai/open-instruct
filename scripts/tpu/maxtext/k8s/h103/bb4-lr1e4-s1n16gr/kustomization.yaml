# H103 bb4-lr1e4-s1n16 (tpu-worker, 2026-10-21; mk_h103_h104.py): H078's bb4-lr1e4-s1 with ragged_buffer_factor 5.0,
# num_vocab_tiling 16, checkpoint_period 200; Amendment 1: log_moe_dropped_tokens on the dropcount image; Amendment 2: 8x8x16, ep-as-cp fsdp 64 x expert 16.
# H078 arm bb4-lr1e4, seed 1: H067 A0''s overlay with GLOBAL_BATCH 64, STEPS 2942, peak LR 1e-4, slice 8x8x8 and its mesh, the
# big-slice image and the data shim's group field changed (generated by mk_h078.py).
# Olmo 3.5 hero-small SFT on TPU, the H045 anchor recipe (olmo35-small-4t-emo base, Dolci-Think, the Olmo 3.5
# template with H045's prefix labelling, 65,536-token sequences, 1,048,576 tokens/step, LR 5e-5, 3% warmup (from step one, as OLMo-core) then
# linear to 0 over 11,768 steps, AdamW wd 0, clip 1.0, router load-balancing 0.01 and router z-loss 1e-5 summed over MoE layers as OLMo-core does, LM-head z-loss 1e-5, EMO off). MoE buffers hold 2.5x the mean load per expert shard (dropless needs 32.9 of 31.75 GiB at 64K; the REQUIRED_RBF
# log line gives, per step and MoE layer, the factor that would have dropped nothing: at most 2.41 over the 600 parity steps).
# STEPS < LR_SCHEDULE_STEPS runs the start of that schedule for loss parity against H045's W&B curve.
# bb4-lr1e4-s1n16gr (2026-10-23): bb4-lr1e4-s1n16 plus the pinned gcsfs retry patch; same resource names, numerics unchanged.
#   kubectl --context gke_ai2-olmo_us-central2-b_gke-tpu-v4 apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: olmo

resources:
- jobset.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: h103-bb4-lr1e4-s1n16-launcher
  files:
  - train_sft.sh # a copy of ../olmo3-sft/train_sft.sh (kustomize loads no files from outside this directory); keep them identical
  - sitecustomize.py # restore-only: gcsfs retries 6 -> GCSFS_RETRIES with jitter, logs GCSFS-RETRY; loaded via PYTHONPATH below
- name: h103-bb4-lr1e4-s1n16-env
  literals:
  - RUN_NAME=olmo35-sft-h103-bb4-lr1e4-s1n16
  - OUTPUT_DIR=gs://ai2-olmo-dev/post-training/runs
  # OLMo-core step5961 converted with o35/convert_olmocore_to_maxtext.py (fp32 masters, padded 100352 vocab).
  - LOAD_PARAMETERS_PATH=gs://ai2-olmo-dev/post-training/checkpoints/olmo35-small-4t-emo-step5961/0/items
  # allenai/dolma2-tokenizer-olmo35 @8b971706 with open-instruct's olmo35 template, saved by o35/tok_oi35.py.
  - MAXTEXT_LOG_BATCH_HASH=1
  - MAXTEXT_R2_DATA_EMULATION=8:2:128:32:4
  - TOKENIZER_PATH=/mnt/post-training/tokenizers/olmo35-8b971706-h045
  - TRAIN_FILES=/mnt/post-training/data/h067/a0prime-s1/*.parquet
  - MODEL_NAME=olmo35-tiny
  - MAXTEXT_SFT_LABELS=prefix
  - TOTAL_DEVICES=1024
  - GLOBAL_BATCH=64
  - PER_DEVICE_BATCH=0.0625
  - SEQ_LEN=65536
  - LR=1e-4
  - WARMUP_FRAC=0.03
  - LR_SCHEDULE_STEPS=2942
  - STEPS=2942
  - NUM_EPOCH=2
  - DATA_SEED=0
  # FSDP 16 x expert 8 = 128 chips, no tensor or context axes (olmo35-ep-as-cp): batch shards over fsdp (16 sequences),
  # and the expert axis is context parallelism outside the dMoE (one 64K sequence over 8 chips) and expert parallelism
  # inside it. KDA's recurrence needs the whole sequence, so its 8 heads shard over the expert axis instead.
  # Sub-block KDA at highest matmul precision: 3.9 s/step against 39 s for FSDP4 x EP4 x TP4 x CP2 (d_model 1024 is too
  # narrow for tensor parallelism), loss parity with H045 passes (#1933). At default precision either KDA path is ~3e-3
  # off the exact recurrence on TPU; highest brings both to ~3e-6 for ~5% of the step.
  - EXTRA_ARGS=override_model_config=true moe_aux_loss_reduction=sum warmup_step_offset=1 z_loss_multiplier=1e-5 emo_enabled=false enable_checkpointing=true checkpoint_period=200 max_num_checkpoints_to_keep=2 custom_mesh_and_rule=olmo35-ep-as-cp ici_fsdp_parallelism=64 ici_expert_parallelism=16 context_parallel_load_balance=false allow_split_physical_axes=true shard_exp_on_fsdp=False ragged_buffer_factor=5.0 log_required_ragged_buffer_factor=true log_moe_dropped_tokens=true sharding_tolerance=0.3 olmoe3_per_layer_remat=true sparse_matmul=true megablox=true use_tokamax_kda=false kda_chunked_impl=subblock kda_matmul_precision=highest num_vocab_tiling=16 remat_policy=full
  - LIBTPU_INIT_ARGS=--xla_enable_async_all_gather=true --xla_tpu_enable_async_ragged_all_to_all=true --xla_tpu_scoped_vmem_limit_kib=16384
  # An environment variable, not a libtpu flag: v4 megacore frees ~1 GiB of HBM.
  - TPU_MEGACORE=MEGACORE_DENSE
  # Restore-only (2026-10-23, H103 note; proof: ledger #643): /launcher first so sitecustomize.py loads; /deps/src is the
  # image's own PYTHONPATH. Pinned to gcsfs 2026.2.0, else exit 3 before any restore.
  - PYTHONPATH=/launcher:/deps/src
  - GCSFS_RETRIES=20
  - GCSFS_JITTER_S=4
  - GCSFS_PIN=2026.2.0

images:
- name: us-docker.pkg.dev/ai2-olmo/olmo/maxtext-posttrain
  newTag: 51f8cc4b-p907d86f3-rfb46e215e-bs3ec936c3-dc88c6c7ea
