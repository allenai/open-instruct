# Four-GPU mechanics test: EP2 Tiny trainer plus one TP2 inference engine.
# Check full decode graph replay across in-place refresh with a small batch.
# Synthetic sibling rewards ensure nonzero gradients despite capped responses.
# Replace YOUR_USERNAME and inspect `plan` before launching.
schema_version = 1
name = "tp2-refresh-smoke"

[model]
source = "/weka/olmo-3p5-post-checkpoints/abhishekr/s-c-gpu/s-c-noag-s34521/hf_step63494"

[output]
root = "/weka/oe-training-default/YOUR_USERNAME/open-instruct/runs/tp2-refresh-smoke"
export_hf = false
rollout_sample_rate = 1.0

[launch]
workspace = "ai2/olmo-rl"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "high"
min_runtime = "0s"
timeout = "1h"
auto_resume = false
gpus_per_replica = 4
memory = "512 GiB"
shared_memory = "64 GiB"

[[launch.weka_mounts]]
weka = "oe-training-default"
mount_path = "/weka/oe-training-default"

[[launch.weka_mounts]]
weka = "olmo-3p5-post-checkpoints"
mount_path = "/weka/olmo-3p5-post-checkpoints"

[launch.env]
OI_MILES_RAY_CPUS = "32"
SGLANG_TIMEOUT_KEEP_ALIVE = "600"

[data]
over_length = "exclude"

[[data.tasks]]
task = "gsm8k-less-noise"
train_count = 64
eval_count = 1

[training]
num_rollouts = 4
learning_rate = 6e-6
filter_zero_std_groups = false
save_checkpoints = false
skip_eval_before_train = true

[trainer]
gpus = 2
expert_parallel_size = 2
sequence_packing = true
packing_max_tokens = 2048

[inference]
placement_mode = "disaggregated"
gpus = 2
rollout_tensor_parallel_size = 2
profile = "generic"
rollout_batch_size = 4
samples_per_prompt = 2
global_batch_size = 8
max_response_length = 512
max_context_length = 2048
sglang_max_running_requests = 8
sglang_server_concurrency = 16
sglang_max_total_tokens = 16384
sglang_max_mamba_cache_size = 16
sglang_mem_fraction_static = 0.6
sglang_disable_radix_cache = true
sglang_cuda_graph_backend_decode = "full"
sglang_cuda_graph_max_bs_decode = 8
sglang_cuda_graph_backend_prefill = "disabled"
sglang_attention_backend = "fa4"
check_weight_update_equal = true

[tracking]
wandb_mode = "offline"
wandb_project = "open-instruct-miles"
wandb_group = "tp2-refresh-smoke"

[core]
publication_mode = "refresh"
max_policy_lag = 6
engine_drain_timeout = 600.0
engine_update_timeout = 900.0
refresh_request_timeout = 900.0
pipeline_observation_interval = 1.0
scoring_check_interval = 1
router_aux_loss_weight = 0.0
router_z_loss_weight = 0.0
reward_reasoning_mode = "required"
reward_zero_truncated = false
max_run_seconds = 2400

[miles]
custom_rm_path = "scripts.miles.tp2_smoke_reward.score"
pause_generation_mode = "in_place"
calculate_per_token_loss = true
use_rollout_routing_replay = true
async_data_buffer_capacity_factor = 2.0
train_env_vars = { PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True" }

[async]
fully_async = true
async_max_concurrent_samples = 16

[compiler_cache]
shared_root = "/weka/oe-training-default/open-instruct-compiler-cache/tmp-7d"
