# Export-only: HF export of the 32k run's update-250 policy (4+12 checkpoint 249, preserved copy) for extra evals.
# v2: RL-zero on the Olmicro 2.7B long-context final (stage3-step0023842) with mixed-policy refresh publication
# (TIS-corrected, max_weight_staleness 12 as in the maintained refresh templates), 32,768-token responses,
# long-context base-model pass-band filtered data dolci-math-base-r1-v1-passband-lc2.7b-32k. Otherwise the v1 recipe: R1 template,
# 32 prompts x 8 samples, lr 1e-6, 400 updates, 4 trainer + 4 inference GPUs, 4 eval samples per prompt.
schema_version = 1
name = "olmicro-2.7b-lc-math-rl-v2-refresh-32k-u300-export-20261118"

[model]
# allenai/olmicro-2.7b-base@stage3-step0023842 (long-context final), SHA256SUMS verified 2026-11-18.
source = "/weka/oe-adapt-default/jacobm/olmicro/models/olmicro-2.7b-base/stage3-step0023842"
format = "hf"

[output]
root = "/weka/oe-adapt-default/jacobm/olmicro/runs/olmicro-2.7b-lc-math-rl-v2-refresh-32k-u300-export-20261118"
export_hf = true

# Observability only (never changes admission or training): every scored group's per-response rewards,
# truncation and status, plus the text of 5% of groups. Source for per-prompt pass rates if we later
# difficulty-filter, and for inspecting responses if rewards stay at zero.
[records]
enabled = true
root = "/weka/oe-adapt-default/jacobm/olmicro/inference-records"
responses = "sample"
response_sample_rate = 0.05

[launch]
memory = "256 GiB"
shared_memory = "64 GiB"
workspace = "ai2/olmo3p5-training"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "urgent"
min_runtime = "1h"
timeout = "24h"
auto_resume = true
max_retries = 3
gpus_per_replica = 8

[[launch.weka_mounts]]
weka = "oe-adapt-default"
mount_path = "/weka/oe-adapt-default"

[launch.secrets]
WANDB_API_KEY = "jacobm_WANDB_API_KEY"
HF_TOKEN = "jacobm_HF_TOKEN"

[launch.env]
MILES_SERVING_STARTUP_TIMEOUT_SECONDS = "900"
MILES_HYBRID_NATIVE = "1"
MILES_HYBRID_BRIDGE = "0"
SGLANG_EXTERNAL_MODEL_PACKAGE = ""
MILES_HYBRID_REFERENCE_BACKBONE = "0"
FLA_CACHE_MODE = "default"
FLA_CONFIG_DIR = "/weka/oe-adapt-default/jacobm/olmicro/fla-configs/b300-fla0.5.2-v1"

[data]
prompt_data = "/weka/oe-adapt-default/jacobm/olmicro/data/dolci-math-base-r1-v1-passband-lc2.7b-32k/train.jsonl"
eval_prompt_data = [
  "math500", "/weka/oe-adapt-default/jacobm/olmicro/data/dolci-math-base-r1-v1-passband-lc2.7b-32k/eval-math500.jsonl",
  "gsm8k_platinum", "/weka/oe-adapt-default/jacobm/olmicro/data/dolci-math-base-r1-v1-passband-lc2.7b-32k/eval-gsm8k_platinum.jsonl",
]
reward_config = "/weka/oe-adapt-default/jacobm/olmicro/data/dolci-math-base-r1-v1-passband-lc2.7b-32k/verifiers.json"
seed = 1
shuffle = true

[training]
# No difficulty filtering for the first run; constant-reward groups give zero gradient.
filter_zero_std_groups = false
# 400 x 32 prompts ~ one pass over the 13,260 training prompts.
num_rollouts = 300
skip_eval_before_train = false
eval_interval = 50
save_checkpoints = true
save_interval = 50

[trainer]
# Native checkpoints only resume on the same trainer world size; keep this fixed for the run.
gpus = 4
trainer_num_nodes = 1
expert_parallel_size = 1
micro_batch_size = 1
sequence_packing = true
packing_max_tokens = 40960
activation_recompute = true

[inference]
placement_mode = "disaggregated"
# Native serving is TP1 only; scale generation with engines. The 450M run was generation-bound.
gpus = 4
rollout_tensor_parallel_size = 1
rollout_batch_size = 32
samples_per_prompt = 8
global_batch_size = 256
max_response_length = 32768
max_context_length = 33280
radix_cache = false
check_weight_update_equal = true
update_weight_buffer_size = 1073741824

[optimizer]
learning_rate = 0.000001
lr_decay_style = "constant"
lr_warmup_iters = 0
weight_decay = 0.0
kl_loss_coef = 0.0
entropy_coef = 0.0
eps_clip = 0.2
eps_clip_high = 0.272

[tracking]
wandb_mode = "online"
wandb_team = "ai2-llm"
wandb_project = "open_instruct_internal"
wandb_group = "olmicro-2.7b-lc-v2-32k-u100-eval"

[core]
diagnostic_interval = 0
scoring_check_interval = 0
replay_diagnostics = false
# allenai/olmicro-2.7b-base HF bucket stage2/checkpoints/step0011921/config.json, SHA256SUMS verified.
model_config = "/weka/oe-adapt-default/jacobm/olmicro/models/olmicro-2.7b-base/olmo-core/stage3-step0023842/config.json"
attention_backend = "flash_4"
fp32_lm_head = false
compile_model = false
checkpoint_keep_last = 3
publication_mode = "refresh"
engine_drain_timeout = 1800.0
router_aux_loss_weight = 0.0
router_z_loss_weight = 0.0

[miles]
# Resume at checkpoint 249; with num_rollouts = 250 the loop is empty and the run only exports HF.
load = "/weka/oe-adapt-default/jacobm/olmicro/preserved-checkpoints/olmicro-2.7b-lc-math-rl-v2-refresh-32k-4x12-20261118/u0300"
sglang_dtype = "bfloat16"
sglang_disable_cuda_graph = false
sglang_cuda_graph_backend_decode = "full"
# Admission per engine: running requests == decode graph batch size (docs/miles/throughput-profiles.md).
sglang_cuda_graph_max_bs_decode = 128
sglang_cuda_graph_backend_prefill = "disabled"
sglang_chunked_prefill_size = -1
sglang_attention_backend = "triton"
sglang_linear_attn_backend = "triton"
sglang_linear_attn_decode_backend = "triton"
sglang_linear_attn_prefill_backend = "triton"
sglang_mem_fraction_static = 0.6
sglang_max_running_requests = 128
sglang_server_concurrency = 128
async_max_concurrent_samples = 512
async_data_buffer_capacity_factor = 1.0
rollout_submission_granularity = "group"
wandb_random_suffix = false
adam_beta1 = 0.9
adam_beta2 = 0.999
rollout_temperature = 1.0
rollout_top_p = 1.0
rollout_seed = 1
seed = 1
rollout_max_prompt_len = 512
# R1 template (tools/format_probe.py): stop when the base model starts a new "User:" turn.
rollout_stop = ["\nUser:"]
disable_grpo_std_normalization = true
calculate_per_token_loss = true
tis_clip = 2.0
eval_temperature = 1.0
eval_top_p = 0.95
n_samples_per_eval_prompt = 4
eval_max_response_len = 32768

[async]
fully_async = true
max_weight_staleness = 12
async_unused_samples_handler = "retry"
off_policy_correction = "tis"

[compiler_cache]
shared_root = "/weka/oe-adapt-default/jacobm/olmicro/compiler-cache/tmp-30d"
