# EOPD (arXiv 2603.07079), setting 2, the paper's method: Qwen3-4B-Base student distilled
# from Qwen3-8B on DAPO-Math-14k with the entropy-gated forward-KL term on top of sampled-token
# OPD. Identical to eopd-opd-qwen3-4b-base-dapo14k.toml (the matched OPD baseline: batch 128
# prompts x 1 sample, PPO mini-batch 32, LR 3e-6 cosine, 4096-token responses, T 1.0, 2 epochs
# = 220 rollouts, kl_coef 1.0, token-mean loss, verl AdamW, trainer-side student log-probs,
# eos remap) except distillation.eopd: alpha 1.0, tau 0.8, k 16 (paper Sec. 4 / App. A; the
# authors' README launch config says k 32). Gate = 1[H(renormalised teacher top-k) > tau], FKL
# over the teacher's top-k with the student at its full-vocabulary probability (Eq. 9-10).
# Paper deltas over the OPD baseline at 4B: +1.80 Avg@8 / +5.05 Pass@8 averaged over six
# benchmarks; MATH-500 OPD baseline 78.81 Avg@8 (ours 78.475, run root -v3).
# One 8-GPU node: 4 trainer TP2 / 3 student SGLang / 1 teacher SGLang.
# Data: scripts/miles/prepare_eopd_math_prompts.py (see docs/miles/opd.md).
schema_version = 1
name = "eopd-eopd-qwen3-4b-base-dapo14k"

[model]
source = "Qwen/Qwen3-4B-Base"
align_eos_with_teacher = true

[teacher]
source = "Qwen/Qwen3-8B"
gpus = 1
concurrency = 32
request_timeout = 900
startup_timeout = 1800

[training]
resume = true
algorithm = "opd"
num_rollouts = 220
save_interval = 20
eval_interval = 44
optimizer_steps_per_rollout = 4
loss_aggregation = "token"
keep_checkpoints = 2

[trainer]
backend = "megatron"
gpus = 4
tensor_parallel_size = 2

[inference]
gpus = 3
tensor_parallel_size = 1
rollout_batch_size = 128
samples_per_prompt = 1
max_response_length = 4096
eval_max_response_length = 8192
max_context_length = 10240
max_running_requests = 128
temperature = 1.0
top_p = 1.0
eval_temperature = 1.0
eval_top_p = 0.8
eval_samples_per_prompt = 8

[distillation]
kl_coef = 1.0
use_rollout_logprobs = false
eopd = true
eopd_alpha = 1.0
eopd_tau = 0.8
eopd_top_k = 16

[optimizer]
learning_rate = 3e-6
lr_decay_style = "cosine"
lr_warmup_iters = 0
min_lr = 0.0
weight_decay = 0.01
adam_beta1 = 0.9
adam_beta2 = 0.999

[output]
root = "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-opd/runs/eopd-eopd-qwen3-4b-base-dapo14k-v1"
assets = "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-opd/assets"

[data]
seed = 42
prompt_data = "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-opd/data/eopd-math-v2-train/dapo_math_14k.jsonl"
eval_prompt_data = [
  "math_500", "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-opd/data/eopd-math-v1/math_500.jsonl",
  "aime24", "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-opd/data/eopd-math-v1/aime24.jsonl",
  "aime25", "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-opd/data/eopd-math-v1/aime25.jsonl",
  "amc23", "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-opd/data/eopd-math-v1/amc23.jsonl",
]
reward_config = "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-opd/data/eopd-math-v1/verifiers.json"

[tracking]
wandb_mode = "online"
wandb_project = "opd"
wandb_entity = "allenai-team1"

[launch]
workspace = "ai2/open-instruct-dev"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "urgent"
min_runtime = "8h"
timeout = "72h"
auto_resume = true
weka_mounts = [{ weka = "oe-adapt-default", mount_path = "/weka/oe-adapt-default" }]

[launch.secrets]
WANDB_API_KEY = "kevinfarhat_WANDB_API_KEY"
