# Two nodes, four B300s: two Core EP2 trainer GPUs; one rollout and one fixed judge.
# Two updates exercise plumbing, not learning. Prepare data on Saturn first.
schema_version = 1
name = "multinode-judges-20260912"

[model]
source = "/weka/oe-training-default/robertb/olmo-miles/checkpoints/olmoe3-kda-1.2b-dolci-think-sft-65536-router-bf16-autocast-v2-hf"
format = "hf"

[output]
root = "/weka/oe-training-default/robertb/open-instruct/runs/multinode-judges-20260912"
export_hf = false

[launch]
workspace = "ai2/open-instruct-dev"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "urgent"
min_runtime = "1h"
timeout = "2h"
auto_resume = false
gpus_per_replica = 2

[[launch.weka_mounts]]
weka = "oe-training-default"
mount_path = "/weka/oe-training-default"

[[launch.weka_mounts]]
weka = "oe-adapt-default"
mount_path = "/weka/oe-adapt-default"

[launch.env]
NCCL_SOCKET_IFNAME = "ib"
NCCL_IB_HCA = "^=mlx5_bond_0"

[data]
prompt_data = "/weka/oe-training-default/robertb/open-instruct/data/multinode-judges-20260912/train.jsonl"
eval_prompt_data = ["mixed", "/weka/oe-training-default/robertb/open-instruct/data/multinode-judges-20260912/eval.jsonl"]
reward_config = "/weka/oe-training-default/robertb/open-instruct/data/multinode-judges-20260912/verifiers.json"
shuffle = false

[training]
num_rollouts = 2
skip_eval_before_train = false
eval_interval = 2
save_checkpoints = false
# Core saves synchronously. Choose a more frequent cadence for recovery.

[trainer]
gpus = 2
trainer_num_nodes = 1
expert_parallel_size = 2
micro_batch_size = 1
activation_recompute = true
trainer_flash_attention_version = 4

[inference]
placement_mode = "disaggregated"
gpus = 1
rollout_tensor_parallel_size = 1
# Bounded plumbing exercise; standard training examples retain 8 x 8.
rollout_batch_size = 8
samples_per_prompt = 2
global_batch_size = 16
max_response_length = 4096
max_context_length = 6144
sglang_server_concurrency = 16
sglang_max_running_requests = 16
sglang_max_total_tokens = 524288
sglang_max_mamba_cache_size = 128
sglang_mem_fraction_static = 0.6
sglang_disable_radix_cache = true
sglang_cuda_graph_backend_decode = "disabled"
sglang_cuda_graph_max_bs_decode = 64
sglang_cuda_graph_backend_prefill = "disabled"
sglang_sampling_backend = "pytorch"
sglang_attention_backend = "triton"
check_weight_update_equal = true
update_weight_buffer_size = 1073741824

[optimizer]
learning_rate = 0.000001
lr_decay_style = "constant"
lr_warmup_iters = 0
weight_decay = 0.0
adam_beta1 = 0.9
adam_beta2 = 0.95
adam_eps = 0.00000001
clip_grad = 1.0
kl_loss_coef = 0.0
entropy_coef = 0.0
eps_clip = 0.2
eps_clip_high = 0.28

[tracking]
wandb_mode = "offline"
wandb_project = "olmo-rl-comparison"
wandb_group = "core-workflow-async"

[runtime]
row_specialization = "dynamic"

[core]
diagnostic_interval = 1
max_train_rollout_logprob_abs_diff = 0.05
router_aux_loss_weight = 0.01
router_z_loss_weight = 0.00001
stream_moe_export = true
weight_sync_mode = "flattened"

[miles]
use_rollout_routing_replay = true
use_miles_router = true
calculate_per_token_loss = true
rollout_temperature = 1.0
rollout_seed = 17
rollout_max_prompt_len = 2048
seed = 17
disable_grpo_std_normalization = true

[async]
fully_async = true
max_weight_staleness = 1
async_data_buffer_capacity_factor = 2.0
async_unused_samples_handler = "retry"
rollout_submission_granularity = "group"
# Core scores the old policy; TIS corrects the behavior-policy mismatch.
off_policy_correction = "tis"

# Opt in separately after qualifying cache reuse for your runtime and hardware.
[compiler_cache]
enabled = true
shared_root = "/weka/oe-training-default/robertb/open-instruct/compiler-cache/tmp-30d"
restore = true

[judges.general]
mode = "managed"
backend = "sglang"
model = "Qwen/Qwen3-32B"
revision = "9216db5781bf21249d130ec9da846c4624c16137"
gpus = 1
tensor_parallel_size = 1
max_context_length = 40960
max_concurrent_calls = 16
chat_template = "qwen3-no-thinking"
prepared_dir = "/weka/oe-adapt-default/robertb/olmo-miles/trial-data/dolci-think-20260908/judge"

[rubrics.quality]
profile = "open-instruct/general-quality"
max_response_tokens = 2048
temperature = 1.0

[rubrics.reference_quality]
profile = "open-instruct/general-quality_ref"
max_response_tokens = 2048
temperature = 1.0

[judging.bindings."general-quality"]
judge = "general"
rubric = "quality"

[judging.bindings."general-quality_ref"]
judge = "general"
rubric = "reference_quality"
