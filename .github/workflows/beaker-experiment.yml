name: Beaker Experiment Launch

on:
  merge_group:

  # Adding a comment to trigger a run.
  workflow_dispatch:  # This allows us to manually trigger a build through the GitHub UI.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: "1"

jobs:
  # The large runner builds the image and launches the Beaker experiments, then
  # exits. Waiting for Beaker happens in the small `wait-experiment` job so the
  # large runner is not billed while idle, and the images are published by
  # separate jobs only once the experiments have passed.
  launch-experiment:
    name: Build and launch Beaker experiments
    runs-on: 8-Core-XL-Runner-Ubuntu-Latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -euo pipefail {0}
    outputs:
      trigger_info: ${{ steps.get-trigger-info.outputs.trigger_info }}
      experiment_ids: ${{ steps.launch.outputs.experiment_ids }}
      experiment_names: ${{ steps.launch.outputs.experiment_names }}
      integration_image_id: ${{ steps.launch.outputs.integration_image_id }}
      short_sha: ${{ steps.launch.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to get commit author info

      - name: Checkout oe-eval-internal
        uses: actions/checkout@v4
        with:
          repository: allenai/oe-eval-internal
          path: './oe-eval-internal'
          ssh-key: ${{ secrets.OE_EVAL_GIT_CLONE_ACCESS_PRIVATE_SSH_DEPLOY_KEY }}
          fetch-depth: 1
          filter: 'blob:none'

      - name: Get trigger information
        id: get-trigger-info
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Get the commit author for push events
            AUTHOR_NAME=$(git log -1 --pretty=format:'%an')
            echo "trigger_info=Push by ${AUTHOR_NAME}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Get the user who triggered the manual dispatch
            echo "trigger_info=Manual dispatch by ${{ github.actor }}" >> $GITHUB_OUTPUT
          fi

      - name: Get changed files using git diff
        id: changed-files
        run: |
          COMMON_ANCESTOR=$(git merge-base HEAD origin/main)

          CHANGED_FILES=$(git diff --name-only ${COMMON_ANCESTOR} HEAD)
          printf 'Changed files:\n%s\n' "$CHANGED_FILES"

          declare -A CHANGE_PATTERNS=(
            [dpo_changed]="open_instruct/(dpo|dpo_tune_cache|dpo_utils)\.py"
            [finetune_changed]="open_instruct/finetune\.py"
          )

          for OUTPUT_KEY in "${!CHANGE_PATTERNS[@]}"; do
            PATTERN="${CHANGE_PATTERNS[$OUTPUT_KEY]}"
            MATCHED=$(grep -qE "$PATTERN" <<< "$CHANGED_FILES" && echo true || echo false)
            echo "${OUTPUT_KEY}=${MATCHED}" >> "$GITHUB_OUTPUT"
          done

          # grpo_fast.py shares most of its imports with the other trainers, so instead of listing its
          # dependencies, run the grpo_fast integration test for any open_instruct/ change outside files
          # grpo_fast.py never imports (grpo.py does import dpo_utils, but this test does not run it).
          GRPO_ALWAYS="(^|/)Dockerfile$|^(mason\.py|pyproject\.toml|uv\.lock)$|^configs/beaker_configs/|^scripts/train/debug/grpo_integration_test\.sh$"
          GRPO_UNRELATED="^open_instruct/(miles/|test_|olmo_core_finetune\.py$|numpy_dataset_conversion\.py$|dpo[a-z_]*\.py$|finetune\.py$)"
          GRPO_RELATED=$(grep -E "^open_instruct/" <<< "$CHANGED_FILES" | grep -vE "$GRPO_UNRELATED" || true)
          if grep -qE "$GRPO_ALWAYS" <<< "$CHANGED_FILES" || [ -n "$GRPO_RELATED" ]; then
            echo "grpo_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "grpo_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Beaker
        uses: allenai/setup-beaker@v2
        with:
          token: ${{ secrets.BEAKER_TOKEN }}
          workspace: ai2/open-instruct-dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          # Install development dependencies needed for mason.py
          uv sync --frozen

      - name: Build image and launch experiments
        id: launch
        env:
          BEAKER_TOKEN: ${{ secrets.BEAKER_TOKEN }}
          DOCKER_CACHE_PUSH: "1"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DPO_CHANGED: ${{ steps.changed-files.outputs.dpo_changed }}
          FINETUNE_CHANGED: ${{ steps.changed-files.outputs.finetune_changed }}
          GRPO_CHANGED: ${{ steps.changed-files.outputs.grpo_changed }}
        run: |
          echo "Building Docker image and launching experiments..."
          echo "Git commit: $(git rev-parse --short HEAD)"

          EXPERIMENT_IDS=()
          EXPERIMENT_NAMES=()

          launch_and_capture() {
            local SCRIPT_PATH="$1"
            local EXPERIMENT_NAME="$2"
            local LOG_FILE="/tmp/beaker_output_${EXPERIMENT_NAME}.log"

            if ! ./scripts/train/build_image_and_launch.sh "$SCRIPT_PATH" 2>&1 | tee "$LOG_FILE"; then
              local EXIT_CODE=${PIPESTATUS[0]}
              echo "ERROR: ${EXPERIMENT_NAME}.sh failed with exit code $EXIT_CODE"
              return $EXIT_CODE
            fi

            local EXPERIMENT_ID
            EXPERIMENT_ID=$(grep -oP 'https://beaker.org/ex/\K[a-zA-Z0-9]+' "$LOG_FILE" | tail -1)
            if [ -z "$EXPERIMENT_ID" ]; then
              echo "ERROR: Failed to extract experiment ID from ${EXPERIMENT_NAME}.sh output"
              echo "DEBUG: Full output log:"
              cat "$LOG_FILE"
              echo "---"
              echo "Please check that the experiment was created successfully."
              return 1
            fi

            EXPERIMENT_IDS+=("$EXPERIMENT_ID")
            # Recorded as each launches, so the cleanup step can stop it if a later launch fails or the
            # run is cancelled before the IDs reach the step outputs.
            echo "$EXPERIMENT_ID" >> "$RUNNER_TEMP/beaker_experiment_ids"
            EXPERIMENT_NAMES+=("$EXPERIMENT_NAME")
            echo "Launched ${EXPERIMENT_NAME} experiment: $EXPERIMENT_ID"
          }

          EXPERIMENT_DEFINITIONS=(
            "oc_sft|scripts/train/debug/oc_sft_integration_test.sh|always"
            "grpo|scripts/train/debug/grpo_integration_test.sh|${GRPO_CHANGED}"
            "dpo|scripts/train/debug/dpo/single_gpu.sh|${DPO_CHANGED}"
            "sft|scripts/train/debug/sft_integration_test.sh|${FINETUNE_CHANGED}"
          )

          for DEFINITION in "${EXPERIMENT_DEFINITIONS[@]}"; do
            IFS='|' read -r EXP_NAME EXP_SCRIPT EXP_CONDITION <<< "$DEFINITION"
            if [ "$EXP_CONDITION" != "true" ] && [ "$EXP_CONDITION" != "always" ]; then
              echo "Skipping ${EXP_NAME} experiment (condition not met)"
              continue
            fi

            echo "=== Launching ${EXP_NAME} ==="
            launch_and_capture "$EXP_SCRIPT" "$EXP_NAME" || {
              EXIT_CODE=$?
              exit $EXIT_CODE
            }
          done

          if [ ${#EXPERIMENT_IDS[@]} -eq 0 ]; then
            echo "ERROR: No experiments were launched."
            exit 1
          fi

          # Record the immutable ID of the image these experiments ran on, read from the experiments
          # themselves. The image name is shared (merge-queue checkouts are detached, so every run
          # uses `...-head-cuda12`) and a concurrent merge-queue entry can reassign it at any time,
          # so the name is not consulted here and the publish job pulls this ID.
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_ID=""
          for i in "${!EXPERIMENT_IDS[@]}"; do
            EXP_IMAGE_IDS=$(beaker experiment get "${EXPERIMENT_IDS[$i]}" --format json \
              | jq -r '[.[0].jobs[].execution.spec.image.beaker // ""] | unique | join(" ")')
            if [ -z "$EXP_IMAGE_IDS" ] || [[ "$EXP_IMAGE_IDS" == *" "* ]]; then
              echo "ERROR: Expected one image for ${EXPERIMENT_NAMES[$i]} (${EXPERIMENT_IDS[$i]}), found '${EXP_IMAGE_IDS}'."
              exit 1
            fi
            IMAGE_DESCRIPTION=$(beaker image get "$EXP_IMAGE_IDS" --format json | jq -r '.[0].description // ""')
            if [[ "$IMAGE_DESCRIPTION" != *"$SHORT_SHA"* ]]; then
              echo "ERROR: ${EXPERIMENT_NAMES[$i]} (${EXPERIMENT_IDS[$i]}) ran on image $EXP_IMAGE_IDS, described as"
              echo "       '$IMAGE_DESCRIPTION', not commit $SHORT_SHA. A concurrent merge-queue entry most"
              echo "       likely reassigned the shared image name between the build and the launch; re-run."
              exit 1
            fi
            echo "${EXPERIMENT_NAMES[$i]} ran on image $EXP_IMAGE_IDS ($IMAGE_DESCRIPTION)"
            # Every image that passes the check above was built from this commit; publish the last.
            IMAGE_ID="$EXP_IMAGE_IDS"
          done
          echo "integration_image_id=${IMAGE_ID}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          echo "experiment_ids=${EXPERIMENT_IDS[*]}" >> $GITHUB_OUTPUT
          echo "experiment_names=${EXPERIMENT_NAMES[*]}" >> $GITHUB_OUTPUT
          echo "All experiments launched successfully!"
          echo "Experiment IDs: ${EXPERIMENT_IDS[*]}"

      - name: Stop experiments on cancellation or failure
        # Covers a failed later launch, or a cancellation before the wait job starts.
        # Stopping an experiment that has already finished is a no-op.
        if: cancelled() || failure()
        env:
          BEAKER_TOKEN: ${{ secrets.BEAKER_TOKEN }}
        run: |
          if [ -s "$RUNNER_TEMP/beaker_experiment_ids" ]; then
            beaker experiment stop $(cat "$RUNNER_TEMP/beaker_experiment_ids") || true
          fi

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🔨 Beaker Experiment Launch failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🔨 *Beaker Experiment Launch* failed on `${{ github.ref_name }}`\n\n*Reason:* Build or launch failed\n*Triggered by:* ${{ github.actor }}\n*Commit:* `${{ github.sha }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

  # None of the jobs in this workflow is a required check (branch protection on main requires
  # only `Run unit tests` and `Code Quality`). This job still always runs, so a failed build or
  # launch shows up as a failed wait instead of a skipped one.
  wait-experiment:
    name: Wait for Beaker experiments
    needs: launch-experiment
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -euo pipefail {0}
    env:
      BEAKER_TOKEN: ${{ secrets.BEAKER_TOKEN }}
      # Kept under the job's timeout-minutes so the script, not the runner, ends the wait.
      BEAKER_WAIT_TIMEOUT: 18m
      EXPERIMENT_IDS: ${{ needs.launch-experiment.outputs.experiment_ids }}
      EXPERIMENT_NAMES: ${{ needs.launch-experiment.outputs.experiment_names }}

    steps:
      - name: Fail if build and launch did not succeed
        if: needs.launch-experiment.result != 'success'
        run: |
          echo "Build and launch Beaker experiments ended with: ${{ needs.launch-experiment.result }}"
          exit 1

      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/test

      - name: Setup Beaker
        uses: allenai/setup-beaker@v2
        with:
          token: ${{ secrets.BEAKER_TOKEN }}
          workspace: ai2/open-instruct-dev

      - name: Wait for all Beaker experiments completion
        id: wait
        run: |
          IDS=($EXPERIMENT_IDS)
          NAMES=($EXPERIMENT_NAMES)

          if [ ${#IDS[@]} -eq 0 ]; then
            echo "ERROR: No experiments detected despite launch job succeeding."
            exit 1
          fi

          FAILED_FILE=$(mktemp)
          ERRORED_FILE=$(mktemp)
          declare -A PIDS

          for i in "${!IDS[@]}"; do
            EXP_ID="${IDS[$i]}"
            EXP_NAME="${NAMES[$i]:-experiment_$i}"

            (
              echo "Waiting for ${EXP_NAME} to succeed: https://beaker.org/ex/${EXP_ID}"
              RESULT=0
              ./scripts/test/wait_for_beaker_experiment.sh "$EXP_ID" "$BEAKER_WAIT_TIMEOUT" || RESULT=$?
              case "$RESULT" in
                0)
                  echo "  [${EXP_NAME}] ✅ succeeded"
                  ;;
                1)
                  echo "  [${EXP_NAME}] ❌ failed with a non-zero exit code"
                  echo "${EXP_ID}|${EXP_NAME}" >> "$FAILED_FILE"
                  echo "${EXP_NAME}" >> "$ERRORED_FILE"
                  ;;
                *)
                  # A queue timeout (the script stops the experiment), or a preempted or
                  # cancelled job with no exit code; neither is a test failure.
                  echo "  [${EXP_NAME}] ❌ did not finish (queue timeout, preemption or cancellation)"
                  echo "${EXP_ID}|${EXP_NAME}" >> "$FAILED_FILE"
                  ;;
              esac
            ) &
            PIDS[$i]=$!
          done

          for pid in "${PIDS[@]}"; do
            wait "$pid" || true
          done

          if [ -s "$FAILED_FILE" ]; then
            echo ""
            echo "❌ One or more experiments failed or timed out. Showing logs:"
            FAILED_EXP_IDS=()
            FAILED_EXP_NAMES=()
            while IFS='|' read -r EXP_ID EXP_NAME; do
              echo ""
              echo "=== Error logs for ${EXP_NAME} (${EXP_ID}) ==="
              # Bounded so that fetching logs after a timeout cannot push the job past its own cap.
              timeout 60 beaker experiment logs "$EXP_ID" | tail -n 200 || true
              FAILED_EXP_IDS+=("$EXP_ID")
              FAILED_EXP_NAMES+=("$EXP_NAME")
            done < "$FAILED_FILE"
            echo "failed_experiment_ids=${FAILED_EXP_IDS[*]}" >> $GITHUB_OUTPUT
            echo "failed_experiment_names=${FAILED_EXP_NAMES[*]}" >> $GITHUB_OUTPUT
            # Experiments that finished with a non-zero exit code, as opposed to ones that never finalized
            # within the await timeout or were preempted.
            echo "errored_experiment_names=$(tr '\n' ' ' < "$ERRORED_FILE")" >> $GITHUB_OUTPUT
            rm -f "$FAILED_FILE" "$ERRORED_FILE"
            exit 1
          fi

          rm -f "$FAILED_FILE" "$ERRORED_FILE"
          echo ""
          echo "✅ All experiments completed successfully!"

      - name: Stop experiments on cancellation or failure
        # Stopping an experiment that has already finished is a no-op. A failed launch is cleaned
        # up by the launch job itself.
        if: (cancelled() || failure()) && needs.launch-experiment.result == 'success'
        run: |
          if [ -n "$EXPERIMENT_IDS" ]; then
            beaker experiment stop $EXPERIMENT_IDS || true
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Beaker Experiment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ needs.launch-experiment.outputs.trigger_info }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Experiments Launched:" >> $GITHUB_STEP_SUMMARY

          IDS=($EXPERIMENT_IDS)
          NAMES=($EXPERIMENT_NAMES)
          FAILED_EXP_IDS="${{ steps.wait.outputs.failed_experiment_ids }}"
          FAILED_EXP_NAMES="${{ steps.wait.outputs.failed_experiment_names }}"

          declare -A FAILED_MAP
          if [ -n "$FAILED_EXP_NAMES" ]; then
            FAILED_IDS=($FAILED_EXP_IDS)
            FAILED_NAMES=($FAILED_EXP_NAMES)
            for i in "${!FAILED_NAMES[@]}"; do
              FAILED_MAP["${FAILED_NAMES[$i]}"]="${FAILED_IDS[$i]}"
            done
          fi

          for i in "${!IDS[@]}"; do
            EXP_ID="${IDS[$i]}"
            EXP_NAME="${NAMES[$i]}"
            if [ -n "${FAILED_MAP[$EXP_NAME]:-}" ]; then
              echo "- **$EXP_NAME** ❌: [View on Beaker](https://beaker.org/ex/$EXP_ID)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **$EXP_NAME** ✅: [View on Beaker](https://beaker.org/ex/$EXP_ID)" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ] && [ "${{ github.event_name == 'merge_group' || github.ref == 'refs/heads/main' }}" = "true" ]; then
            echo "✅ **Status:** All experiments completed successfully; the publish jobs push the images next." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Status:** All experiments completed successfully (images not pushed: only merge_group and main publish)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.launch-experiment.result }}" != "success" ]; then
            echo "❌ **Status:** Build or launch failed, so no experiments were waited for (image not pushed)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Experiments failed or timed out (image not pushed)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Determine failure reason
        id: failure-reason
        # A failed build or launch is reported to Slack by the launch job itself.
        if: failure() && needs.launch-experiment.result == 'success'
        run: |
          FAILED_EXPERIMENTS="${{ steps.wait.outputs.failed_experiment_names }}"
          ERRORED_EXPERIMENTS="${{ steps.wait.outputs.errored_experiment_names }}"

          # Skip Slack notification for timeouts (when experiments didn't finalize in time)
          if [ -n "${ERRORED_EXPERIMENTS// /}" ]; then
            echo "reason=Experiment failed: ${ERRORED_EXPERIMENTS}" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          elif [ -n "$FAILED_EXPERIMENTS" ]; then
            echo "is_timeout=true" >> $GITHUB_OUTPUT
            echo "Skipping Slack notification - experiments timed out: ${FAILED_EXPERIMENTS}"
          else
            echo "reason=Workflow failed (see logs for details)" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack on Failure
        if: failure() && needs.launch-experiment.result == 'success' && steps.failure-reason.outputs.is_timeout != 'true'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.failure-reason.outputs.emoji }} Beaker Experiment Launch failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.failure-reason.outputs.emoji }} *Beaker Experiment Launch* failed on `${{ github.ref_name }}`\n\n*Reason:* ${{ steps.failure-reason.outputs.reason }}\n*Triggered by:* ${{ github.actor }}\n*Commit:* `${{ github.sha }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

  publish-cuda12-image:
    name: Publish CUDA 12 images
    needs: [launch-experiment, wait-experiment]
    # A manual dispatch from a branch tests the workflow without replacing the published images.
    if: github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
    # Large runner for its disk: the image is about 26 GB, and the standard runner guarantees 14 GB.
    runs-on: 8-Core-XL-Runner-Ubuntu-Latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -euo pipefail {0}
    env:
      BEAKER_TOKEN: ${{ secrets.BEAKER_TOKEN }}
      # The immutable Beaker ID of the image the experiments ran on, recorded by the launch job.
      IMAGE_ID: ${{ needs.launch-experiment.outputs.integration_image_id }}
      SHORT_SHA: ${{ needs.launch-experiment.outputs.short_sha }}
      LOCAL_IMAGE: open-instruct-integration-test:tested

    steps:
      - name: Setup Beaker
        uses: allenai/setup-beaker@v2
        with:
          token: ${{ secrets.BEAKER_TOKEN }}
          workspace: ai2/open-instruct-dev

      - name: Pull the tested image from Beaker by ID
        run: |
          if [ -z "$IMAGE_ID" ] || [ -z "$SHORT_SHA" ]; then
            echo "ERROR: The launch job did not record the tested image ID and commit."
            exit 1
          fi
          DESCRIPTION=$(beaker image get "$IMAGE_ID" --format json | jq -r '.[0].description // ""')
          if [[ "$DESCRIPTION" != *"$SHORT_SHA"* ]]; then
            echo "ERROR: Image $IMAGE_ID is described as '$DESCRIPTION', not commit $SHORT_SHA."
            exit 1
          fi
          beaker image pull "$IMAGE_ID" "$LOCAL_IMAGE"
          if ! docker image inspect "$LOCAL_IMAGE" >/dev/null 2>&1; then
            # The runner starts with no images, so the pulled one is the only candidate.
            mapfile -t PULLED < <(docker images -q | sort -u)
            if [ "${#PULLED[@]}" -ne 1 ]; then
              echo "ERROR: Expected exactly one local image after the pull, found ${#PULLED[@]}."
              docker images
              exit 1
            fi
            docker tag "${PULLED[0]}" "$LOCAL_IMAGE"
          fi

      - name: Check image
        run: docker run --rm "$LOCAL_IMAGE"

      - name: Push CUDA 12 images to Beaker
        run: |
          DESCRIPTION="Created from commit: ${SHORT_SHA}; CUDA: 12 (GitHub run ${GITHUB_RUN_ID})"
          BEAKER_USER=$(beaker account whoami --format json | jq -r '.[0].name')

          publish_image() {
            local TARGET_IMAGE="$1"

            echo "Renaming ${BEAKER_USER}/${TARGET_IMAGE} to release prior alias (if present)."
            beaker image rename "${BEAKER_USER}/${TARGET_IMAGE}" "" || true

            echo "Publishing ${TARGET_IMAGE} with updated image and description."
            beaker image create --name "$TARGET_IMAGE" --description "$DESCRIPTION" "$LOCAL_IMAGE"
          }

          publish_image open_instruct_auto
          publish_image open_instruct_auto_cuda12

      - name: Summary
        run: echo "CUDA 12 images published as \`open_instruct_auto\` and \`open_instruct_auto_cuda12\` from Beaker image \`${IMAGE_ID}\`." >> "$GITHUB_STEP_SUMMARY"

  publish-cuda13-image:
    name: Publish CUDA 13 image
    needs: wait-experiment
    if: github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
    runs-on: 8-Core-XL-Runner-Ubuntu-Latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout oe-eval-internal
        uses: actions/checkout@v4
        with:
          repository: allenai/oe-eval-internal
          path: './oe-eval-internal'
          ssh-key: ${{ secrets.OE_EVAL_GIT_CLONE_ACCESS_PRIVATE_SSH_DEPLOY_KEY }}
          fetch-depth: 1
          filter: 'blob:none'

      - name: Setup Beaker
        uses: allenai/setup-beaker@v2
        with:
          token: ${{ secrets.BEAKER_TOKEN }}
          workspace: ai2/open-instruct-dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CUDA 13 image
        id: build
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE="open-instruct-auto-cuda13:${SHORT_SHA}"
          CACHE_REPO="ghcr.io/allenai/open-instruct:buildcache-cuda13"

          if docker buildx build --platform=linux/amd64 \
            --build-arg GIT_COMMIT="$SHORT_SHA" \
            --build-arg GIT_BRANCH="${GITHUB_REF_NAME}" \
            --build-arg CUDA_VERSION=13 \
            --cache-from "type=registry,ref=${CACHE_REPO}" \
            --cache-to "type=registry,ref=${CACHE_REPO},mode=max" \
            --load \
            --tag "$IMAGE" \
            .; then
            echo "CUDA 13 build succeeded with cache push."
          else
            echo "Warning: CUDA 13 build with cache push failed. Retrying without cache push."
            docker buildx build --platform=linux/amd64 \
              --build-arg GIT_COMMIT="$SHORT_SHA" \
              --build-arg GIT_BRANCH="${GITHUB_REF_NAME}" \
              --build-arg CUDA_VERSION=13 \
              --cache-from "type=registry,ref=${CACHE_REPO}" \
              --load \
              --tag "$IMAGE" \
              .
          fi

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Check image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: docker run --rm "$IMAGE"

      - name: Push image to Beaker
        env:
          SOURCE_IMAGE: ${{ steps.build.outputs.image }}
          TARGET_IMAGE: open_instruct_auto_cuda13
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DESCRIPTION="Created from commit: ${SHORT_SHA}; CUDA: 13 (GitHub run ${GITHUB_RUN_ID})"
          BEAKER_USER=$(beaker account whoami --format json | jq -r '.[0].name')

          echo "Renaming ${BEAKER_USER}/${TARGET_IMAGE} to release prior alias (if present)."
          beaker image rename "${BEAKER_USER}/${TARGET_IMAGE}" "" || true

          echo "Publishing ${TARGET_IMAGE} with updated image and description."
          beaker image create --name "$TARGET_IMAGE" --description "$DESCRIPTION" "$SOURCE_IMAGE"

      - name: Summary
        run: echo "CUDA 13 image published as \`open_instruct_auto_cuda13\`." >> "$GITHUB_STEP_SUMMARY"

  # The published images stop updating if a publish job fails, so tell Slack.
  notify-publish-failure:
    name: Notify Slack on publish failure
    needs: [publish-cuda12-image, publish-cuda13-image]
    if: ${{ always() && (needs.publish-cuda12-image.result == 'failure' || needs.publish-cuda13-image.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Notify Slack on Failure
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "📦 Beaker image publish failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "📦 *Beaker image publish* failed on `${{ github.ref_name }}`\n\n*Reason:* CUDA 12 publish: ${{ needs.publish-cuda12-image.result }}; CUDA 13 publish: ${{ needs.publish-cuda13-image.result }}. `open_instruct_auto*` may be stale.\n*Triggered by:* ${{ github.actor }}\n*Commit:* `${{ github.sha }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
