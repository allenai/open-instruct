name: Tests

on:
  pull_request:
    branches:
      - main
  merge_group:

jobs:

  unit-tests:
    name: Run unit tests
    runs-on: 8-Core-XL-Runner-Ubuntu-Latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.6"
      - name: Set up Python
        run: uv sync --frozen
      - name: Run unit tests
        run: uv run --frozen pytest

  # The GPU tests run on Beaker. The large runner only builds the image and
  # launches the Beaker job; waiting for Beaker happens in the small
  # `gpu-tests` job below so the large runner is not billed while idle.
  gpu-tests-launch:
    name: Build and launch GPU tests
    runs-on: 8-Core-XL-Runner-Ubuntu-Latest
    timeout-minutes: 30
    concurrency:
      group: gpu-tests-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash -euo pipefail {0}
    outputs:
      run_gpu_tests: ${{ steps.check.outputs.run_gpu_tests }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}
      override_experiment_id: ${{ steps.check.outputs.gpu_tests_exp_id }}
      experiment_id: ${{ steps.launch.outputs.experiment_id }}
    steps:

      - name: Checkout code (for scripts)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/test

      - name: Detect fork PR and parse GPU_TESTS override
        id: check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ./scripts/test/detect_gpu_tests_skip.sh \
            "${{ github.event_name }}" \
            "${{ github.event.pull_request.head.repo.full_name }}" \
            "${{ github.repository }}" \
            "$PR_BODY"

      - name: Checkout code
        if: env.RUN_GPU_TESTS == 'true'
        uses: actions/checkout@v4

      - name: Install uv
        if: env.RUN_GPU_TESTS == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.6"

      - name: Set up Python
        if: env.RUN_GPU_TESTS == 'true'
        run: uv sync --frozen

      - name: Setup Beaker
        if: env.RUN_GPU_TESTS == 'true'
        uses: allenai/setup-beaker@v2
        with:
          token: ${{ secrets.BEAKER_TOKEN }}
          workspace: ai2/open-instruct-dev

      - name: Set up Docker Buildx
        if: env.RUN_GPU_TESTS == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: env.RUN_GPU_TESTS == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: env.RUN_GPU_TESTS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: open-instruct-gpu-tests:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.head_ref || github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/allenai/open-instruct:buildcache
          cache-to: type=inline

      - name: Upload image to Beaker and launch tests
        id: launch
        if: env.RUN_GPU_TESTS == 'true'
        env:
          BEAKER_TOKEN: ${{ secrets.BEAKER_TOKEN }}
        run: ./scripts/test/launch_gpu_tests_on_beaker.sh "${{ github.sha }}"

      - name: Stop GPU test experiment on cancellation or failure
        # Covers a run that is cancelled or fails after launching but before the wait job starts.
        if: (cancelled() || failure()) && env.RUN_GPU_TESTS == 'true'
        env:
          BEAKER_TOKEN: ${{ secrets.BEAKER_TOKEN }}
        run: |
          if [ -s "$RUNNER_TEMP/gpu_test_experiment_id" ]; then
            beaker experiment stop "$(cat "$RUNNER_TEMP/gpu_test_experiment_id")" || true
          fi

  gpu-tests:
    name: Run GPU tests
    needs: gpu-tests-launch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gpu-tests-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash -euo pipefail {0}
    env:
      RUN_GPU_TESTS: ${{ needs.gpu-tests-launch.outputs.run_gpu_tests }}
      SKIP_REASON: ${{ needs.gpu-tests-launch.outputs.skip_reason }}
      OVERRIDE_EXPERIMENT_ID: ${{ needs.gpu-tests-launch.outputs.override_experiment_id }}
      EXPERIMENT_ID: ${{ needs.gpu-tests-launch.outputs.experiment_id }}
    steps:

      - name: Checkout code (for scripts)
        if: env.RUN_GPU_TESTS == 'true' || env.SKIP_REASON == 'override'
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/test

      - name: Setup Beaker
        if: env.RUN_GPU_TESTS == 'true' || env.SKIP_REASON == 'override'
        uses: allenai/setup-beaker@v2
        with:
          token: ${{ secrets.BEAKER_TOKEN }}
          workspace: ai2/open-instruct-dev

      - name: Verify GPU_TESTS override experiment
        if: env.SKIP_REASON == 'override'
        run: ./scripts/test/verify_gpu_tests_override.sh "$OVERRIDE_EXPERIMENT_ID"

      - name: Wait for GPU tests on Beaker
        if: env.RUN_GPU_TESTS == 'true'
        env:
          BEAKER_TOKEN: ${{ secrets.BEAKER_TOKEN }}
        run: ./scripts/test/wait_for_beaker_experiment.sh "$EXPERIMENT_ID" 18m

      - name: Stop GPU test experiment on cancellation
        # The wait script stops the experiment on its own timeout; a cancelled run is killed before it can.
        if: cancelled() && env.RUN_GPU_TESTS == 'true' && env.EXPERIMENT_ID != ''
        env:
          BEAKER_TOKEN: ${{ secrets.BEAKER_TOKEN }}
        run: beaker experiment stop "$EXPERIMENT_ID" || true
