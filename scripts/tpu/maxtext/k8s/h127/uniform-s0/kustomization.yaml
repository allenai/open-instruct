# H127 prospective screen. Do not launch until numerical/data qualification is recorded.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: olmo
resources:
- jobset.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- name: robertb-pres14t-v1-uniform-screen-launcher
  files:
  - train_sft.sh
  - routing_log_fix.py
  - embedding_fp32_gather_patch.py
- name: robertb-pres14t-v1-uniform-screen-env
  literals:
  - RUN_NAME=robertb-pres14t-v1-uniform-screen
  - OUTPUT_DIR=gs://ai2-olmo-dev/post-training/runs/robertb/presentation14t-v1
  - LOAD_PARAMETERS_PATH=gs://ai2-olmo-dev/post-training/checkpoints/robertb/olmo35-14t600b-lc-atomic-v1/0/items
  - MAXTEXT_LOG_BATCH_HASH=1
  - TOKENIZER_PATH=/mnt/post-training/data/robertb/tpu-presentation14t-full-v1/tokenizer
  - TRAIN_FILES=/mnt/post-training/data/robertb/tpu-presentation14t-full-v1/uniform/*.parquet
  - MODEL_NAME=olmo35-tiny
  - MAXTEXT_SFT_LABELS=prefix
  - TOTAL_DEVICES=128
  - GLOBAL_BATCH=16
  - PER_DEVICE_BATCH=0.125
  - SEQ_LEN=65536
  - LR=5e-5
  - WARMUP_FRAC=0.03
  - LR_SCHEDULE_STEPS=11768
  - STEPS=2048
  - NUM_EPOCH=2
  - DATA_SEED=0
  - EXTRA_ARGS=override_model_config=true moe_aux_loss_reduction=sum warmup_step_offset=1
    z_loss_multiplier=1e-5 emo_enabled=false enable_checkpointing=true checkpoint_period=512
    max_num_checkpoints_to_keep=4 custom_mesh_and_rule=olmo35-ep-as-cp ici_fsdp_parallelism=16
    ici_expert_parallelism=8 context_parallel_load_balance=false allow_split_physical_axes=true
    shard_exp_on_fsdp=False ragged_buffer_factor=2.5 log_required_ragged_buffer_factor=true
    log_moe_dropped_tokens=true sharding_tolerance=0.3 olmoe3_per_layer_remat=true
    sparse_matmul=true megablox=true use_tokamax_kda=false kda_chunked_impl=subblock
    kda_matmul_precision=highest num_vocab_tiling=16 remat_policy=full
  - LIBTPU_INIT_ARGS=--xla_enable_async_all_gather=true --xla_tpu_enable_async_ragged_all_to_all=true
    --xla_tpu_scoped_vmem_limit_kib=16384
  - TPU_MEGACORE=MEGACORE_DENSE
images:
- name: us-docker.pkg.dev/ai2-olmo/olmo/maxtext-posttrain
  digest: sha256:18a36668969fbd985b222bf1f482f987aee2a4cdddfb9844d842843fc38ea2e7
