name: MILES contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'open_instruct/miles/**'
      - 'open_instruct/test_miles*.py'
      - 'tests/miles/**'
      - 'scripts/miles/**'
      - 'runtime/miles/**'
      - 'configs/miles/**'
      - 'docs/miles/**'
      - '.github/workflows/miles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: 8-Core-XL-Runner-Ubuntu-Latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.8.6'
      - run: uv sync --frozen
      - name: Check integration, scripts and runtime test style
        run: |
          uv run --frozen ruff check open_instruct/miles scripts/miles tests/miles
          uv run --frozen ruff format --check open_instruct/miles scripts/miles tests/miles
      - name: Check CPU contracts and generated references
        env:
          OMP_NUM_THREADS: '1'
        run: |
          uv run --frozen pytest open_instruct/test_miles*.py
          uv run --frozen python -m scripts.miles.generate_docs --check
      - name: Fetch public Core type definitions at the runtime pin
        run: |
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          from scripts.miles import prepare_runtime
          source = json.loads(Path('runtime/miles/runtime.lock.json').read_text())['sources']['olmo-core']
          prepare_runtime.prepare_source('olmo-core', source, Path('runs/typecheck-core'))
          PY
      - name: Check adapter against its Core API
        run: uv run --frozen ty check open_instruct/miles --extra-search-path runs/typecheck-core/src --config 'src.exclude = []'
