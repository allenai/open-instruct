# MOPD 300 final eval (seed 3, 2026-11-11): mopd-qwen35-9b-all3-300u-s3/hf-299; copy of all3-eval8-qwen35-9b-mixrl-hf299-s3.toml (runs/mopd300/PREREG.md)
# (training.eval_only) on the frozen v3 eval sets with the v4 verifiers: 8 samples per prompt, temperature 1.
# Same sampler and settings as the pilot runs' in-training evals; no training.
schema_version = 1
name = "all3-eval8-qwen35-9b-mopd300-hf299-s3"

[model]
source = "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-rl/runs/mopd-qwen35-9b-all3-300u-s3/hf-299"
architecture = "qwen3.5-9B"

[training]
algorithm = "grpo"
eval_only = true
resume = true
num_rollouts = 1
save_interval = 1
eval_interval = 1
optimizer_steps_per_rollout = 1
loss_aggregation = "token"
keep_checkpoints = 0

[trainer]
backend = "megatron"
gpus = 4
tensor_parallel_size = 2

[inference]
gpus = 4
tensor_parallel_size = 1
rollout_batch_size = 64
samples_per_prompt = 8
max_prompt_length = 2048
max_response_length = 16384
max_context_length = 18432
max_running_requests = 128
temperature = 1.0
top_p = 1.0
eval_temperature = 1.0
eval_top_p = 1.0
eval_samples_per_prompt = 8

[optimizer]
learning_rate = 1e-6
lr_decay_style = "constant"
weight_decay = 0.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_grad = 1.0

[objective]
policy_loss = "dppo"
use_rollout_logprobs = true
dppo_divergence_type = "tv"
dppo_threshold = 0.1
std_normalization = false

[reward]
exclude_truncated = false

[output]
root = "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-rl/evals/all3-eval8-qwen35-9b-mopd300-hf299-s3"
assets = "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-rl/assets/all3-eval8-qwen35-9b-mopd300-hf299-s3"

[data]
seed = 42
prompt_data = "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-rl/data/dolci-rl-qwen35-9b-v4/train_ifeval.jsonl"
eval_prompt_data = [
  "eval_math", "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-rl/data/dolci-rl-qwen35-9b-v4/eval_math.jsonl",
  "eval_ifeval", "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-rl/data/dolci-rl-qwen35-9b-v4/eval_ifeval.jsonl",
  "eval_code", "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-rl/data/dolci-rl-qwen35-9b-v4/eval_code.jsonl",
]
reward_config = "/weka/oe-adapt-default/allennlp/deletable_checkpoint/kevinfarhat/miles-rl/data/dolci-rl-qwen35-9b-v4/verifiers.json"

[tracking]
wandb_mode = "online"
wandb_project = "miles-mopd-phase1"
wandb_entity = "allenai-team1"

[launch]
workspace = "ai2/olmo-instruct"
budget = "ai2/oe-other"
cluster = "ai2/holmes"
priority = "urgent"
min_runtime = "1h"
timeout = "3h"
auto_resume = true
gpus_per_replica = 8
weka_mounts = [{ weka = "oe-adapt-default", mount_path = "/weka/oe-adapt-default" }]

[launch.secrets]
WANDB_API_KEY = "kevinfarhat_WANDB_API_KEY"

# Async producer as in the Qwen3.5-2B async OPD smoke (opd2b-graphon128-251-async-smoke2), with the
# teacher run's age budget of 5. 1024 in-flight samples matches Open Instruct async 4 (4 x 256).
[miles]
rollout_sample_rate = 1.0  # save every answer for per-prompt paired stats
fully_async = true
max_weight_staleness = 5
async_max_concurrent_samples = 1024
async_data_buffer_capacity_factor = 2.0
async_unused_samples_handler = "drop"
rollout_submission_granularity = "group"
pause_generation_mode = "retract"

# Serving setting from the audited OPD 100-update run.
sglang_disable_cuda_graph = false
sglang_cuda_graph_backend_decode = "full"
sglang_cuda_graph_max_bs_decode = 128
sglang_cuda_graph_backend_prefill = "disabled"
