# H161 hero-c12-b2-2ep (ledger hypotheses/H161): H149's c12-b2-s0 with H161's two changes only: the union of G2's
# c12a7 shard sets for seeds 0 and 1 (every mixer row twice, in two shuffles; DATA_SEED 0) and S2 = 60700 steps (G1:
# the TPU loader's packed-sequence count over the union, over 16).
#   kubectl --context gke_ai2-olmo_us-central2-b_gke-tpu-v4 apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: olmo

resources:
- jobset.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: h161-hero-launcher
  files:
  - train_sft.sh # a copy of ../olmo3-sft/train_sft.sh (kustomize loads no files from outside this directory); keep them identical
- name: h161-hero-env
  literals:
  - RUN_NAME=olmo35-sft-hero-c12-b2-2ep
  - OUTPUT_DIR=gs://ai2-olmo-dev/post-training/runs
  # B2's masters with the two promoted rows seeded (fp32 upcast of the bf16 mean), converted with o35/convert_olmocore_to_maxtext.py.
  - LOAD_PARAMETERS_PATH=gs://ai2-olmo-dev/post-training/checkpoints/olmo35-small-mm-ckpt2-256k-amt/h149-step22240-c12seed/0/items
  # H124's promoted tokenizer: olmo35-8b971706-h045 with <think>/</think> in reserved slots 100256/100266 (#1911).
  - TOKENIZER_PATH=/mnt/post-training/tokenizers/olmo35-8b971706-h124-atomic
  - TRAIN_FILES=/mnt/post-training/data/h149/c12a7/s[01]/*.parquet
  - MODEL_NAME=olmo35-tiny
  - MAXTEXT_SFT_LABELS=prefix
  - MAXTEXT_LOG_BATCH_HASH=1
  - TOTAL_DEVICES=128
  - GLOBAL_BATCH=16
  - PER_DEVICE_BATCH=0.125
  - SEQ_LEN=65536
  - LR=5e-5
  - WARMUP_FRAC=0.03
  - LR_SCHEDULE_STEPS=60700
  - STEPS=60700
  - NUM_EPOCH=2
  - DATA_SEED=0
  # FSDP 16 x expert 8 = 128 chips, no tensor or context axes (olmo35-ep-as-cp): batch shards over fsdp (16 sequences),
  # and the expert axis is context parallelism outside the dMoE (one 64K sequence over 8 chips) and expert parallelism
  # inside it. KDA's recurrence needs the whole sequence, so its 8 heads shard over the expert axis instead.
  # Sub-block KDA at highest matmul precision: 3.9 s/step against 39 s for FSDP4 x EP4 x TP4 x CP2 (d_model 1024 is too
  # narrow for tensor parallelism), loss parity with H045 passes (#1933). At default precision either KDA path is ~3e-3
  # off the exact recurrence on TPU; highest brings both to ~3e-6 for ~5% of the step.
  - EXTRA_ARGS=override_model_config=true moe_aux_loss_reduction=sum warmup_step_offset=1 z_loss_multiplier=1e-5 emo_enabled=false enable_checkpointing=true checkpoint_period=300 max_num_checkpoints_to_keep=10 custom_mesh_and_rule=olmo35-ep-as-cp ici_fsdp_parallelism=16 ici_expert_parallelism=8 context_parallel_load_balance=false allow_split_physical_axes=true shard_exp_on_fsdp=False ragged_buffer_factor=2.5 log_required_ragged_buffer_factor=true log_moe_dropped_tokens=true sharding_tolerance=0.3 olmoe3_per_layer_remat=true sparse_matmul=true megablox=true use_tokamax_kda=false kda_chunked_impl=subblock kda_matmul_precision=highest num_vocab_tiling=16 remat_policy=full
  - LIBTPU_INIT_ARGS=--xla_enable_async_all_gather=true --xla_tpu_enable_async_ragged_all_to_all=true --xla_tpu_scoped_vmem_limit_kib=16384
  # An environment variable, not a libtpu flag: v4 megacore frees ~1 GiB of HBM.
  - TPU_MEGACORE=MEGACORE_DENSE

images:
- name: us-docker.pkg.dev/ai2-olmo/olmo/maxtext-posttrain
  newTag: 51f8cc4b-p907d86f3-rfb46e215e-bs3ec936c3-dc88c6c7ea
